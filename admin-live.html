<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuztom — Studio Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

:root {
  --bg:        #080808;
  --surface:   #111111;
  --surface2:  #181818;
  --surface3:  #202020;
  --gold:      #C9A96E;
  --gold-lt:   #E8D5A3;
  --gold-dim:  rgba(201,169,110,0.15);
  --gold-glow: rgba(201,169,110,0.06);
  --text:      #F0EAE0;
  --muted:     rgba(240,234,224,0.45);
  --border:    rgba(201,169,110,0.18);
  --danger:    #E06C75;
  --radius:    12px;
}

html, body {
  height:100%; overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:'Jost', sans-serif;
  font-size:13px;
}

/* ── LOCK SCREEN ─────────────────────────────────────────────── */
#lock-screen {
  position:fixed; inset:0; z-index:9999;
  background:radial-gradient(ellipse at 50% 40%, #141008 0%, #050505 70%);
  display:flex; align-items:center; justify-content:center;
}
#lock-screen::before {
  content:''; position:absolute; inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='0.5' fill='rgba(201,169,110,0.15)'/%3E%3C/svg%3E");
  opacity:0.5;
}
#lock-box {
  position:relative; z-index:1;
  background:rgba(14,12,8,0.95);
  border:1px solid rgba(201,169,110,0.25);
  border-radius:24px; padding:52px 44px; width:380px; text-align:center;
  box-shadow:0 0 120px rgba(201,169,110,0.06), 0 40px 80px rgba(0,0,0,0.8);
  backdrop-filter:blur(20px);
}
#lock-brand {
  font-family:'Cormorant Garamond', serif;
  font-size:36px; font-weight:600; color:var(--gold);
  letter-spacing:6px; margin-bottom:4px;
}
#lock-sub { font-size:11px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-bottom:36px; }
#lock-divider { width:40px; height:1px; background:var(--gold); margin:0 auto 36px; opacity:0.4; }
#lock-input {
  width:100%; padding:15px 18px; background:rgba(201,169,110,0.04);
  border:1px solid rgba(201,169,110,0.2); border-radius:10px;
  color:var(--text); font-size:16px; font-family:'Jost',sans-serif;
  text-align:center; letter-spacing:4px; outline:none;
  transition:border-color 0.3s, box-shadow 0.3s; margin-bottom:14px;
}
#lock-input:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,169,110,0.08); }
#lock-btn {
  width:100%; padding:14px; border:none; border-radius:10px; cursor:pointer;
  background:linear-gradient(135deg, #C9A96E 0%, #E8D5A3 50%, #C9A96E 100%);
  background-size:200% 100%; background-position:100% 0;
  color:#0a0a0a; font-family:'Jost',sans-serif; font-size:13px; font-weight:700;
  letter-spacing:1.5px; text-transform:uppercase;
  transition:background-position 0.4s, transform 0.15s;
}
#lock-btn:hover { background-position:0 0; transform:translateY(-1px); }
#lock-error { font-size:12px; color:var(--danger); margin-top:12px; min-height:18px; }
#lock-info { font-size:10px; color:var(--muted); margin-top:8px; }

/* ── MAIN APP ─────────────────────────────────────────────────── */
#app { display:none; height:100vh; flex-direction:column; }
#app.visible { display:flex; }

/* Top bar */
#topbar {
  height:58px; flex-shrink:0;
  background:rgba(10,8,5,0.95); border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 24px; gap:16px;
  backdrop-filter:blur(20px); z-index:100;
}
#topbar-brand {
  font-family:'Cormorant Garamond', serif;
  font-size:22px; font-weight:600; color:var(--gold);
  letter-spacing:4px; margin-right:auto;
}
#topbar-tag {
  font-size:9px; letter-spacing:2px; text-transform:uppercase;
  color:var(--gold); background:rgba(201,169,110,0.1);
  border:1px solid rgba(201,169,110,0.2); border-radius:20px;
  padding:3px 10px; margin-right:4px;
}
.live-dot { width:7px; height:7px; border-radius:50%; background:#E85D5D; box-shadow:0 0 8px #E85D5D; animation:pulse-red 1.5s infinite; }
@keyframes pulse-red { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

/* Layout */
#layout { display:flex; flex:1; overflow:hidden; }

/* Left panel - gallery */
#col-gallery {
  width:220px; flex-shrink:0;
  background:rgba(10,8,5,0.6); border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
}
#gallery-header {
  padding:16px; border-bottom:1px solid var(--border);
  font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted);
}
#gallery-search {
  width:100%; padding:8px 12px; background:rgba(201,169,110,0.04);
  border:none; border-bottom:1px solid var(--border); border-radius:0;
  color:var(--text); font-family:'Jost',sans-serif; font-size:12px; outline:none;
}
#gallery-search::placeholder { color:var(--muted); }
#gallery-list { flex:1; overflow-y:auto; padding:8px; }
#gallery-list::-webkit-scrollbar { width:3px; }
#gallery-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

.gallery-card {
  display:flex; flex-direction:column; gap:8px;
  padding:10px; margin-bottom:8px;
  border:1px solid transparent; border-radius:10px;
  cursor:pointer; transition:all 0.2s; position:relative;
}
.gallery-card:hover { background:var(--gold-dim); border-color:var(--border); }
.gallery-card.active {
  background:rgba(201,169,110,0.12); border-color:rgba(201,169,110,0.4);
  box-shadow:0 0 20px rgba(201,169,110,0.06);
}
.gallery-card-thumb {
  width:100%; height:70px; border-radius:6px; overflow:hidden;
  background:#1a1a1a; border:1px solid rgba(255,255,255,0.05);
}
.gallery-card-thumb canvas { width:100%; height:100%; display:block; }
.gallery-card-name { font-size:11px; color:var(--text); line-height:1.3; font-weight:500; }

/* Center - viewer */
#col-center {
  flex:1; display:flex; flex-direction:column;
  position:relative; overflow:hidden;
}
#viewer-container {
  flex:1; display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
  transition:background 0.8s ease;
}
/* Fonds d'ambiance */
#viewer-container[data-bg="mariage"] {
  background:radial-gradient(ellipse at 50% 60%, rgba(212,180,130,0.12) 0%, transparent 60%),
    linear-gradient(180deg, #0a0806 0%, #100d08 100%);
}
#viewer-container[data-bg="bapteme"] {
  background:radial-gradient(ellipse at 50% 60%, rgba(130,160,220,0.12) 0%, transparent 60%),
    linear-gradient(180deg, #070810 0%, #080a12 100%);
}
#viewer-container[data-bg="anniversaire"] {
  background:radial-gradient(ellipse at 50% 60%, rgba(220,130,180,0.12) 0%, transparent 60%),
    linear-gradient(180deg, #100708 0%, #120a0a 100%);
}
#viewer-container[data-bg="babyshower"] {
  background:radial-gradient(ellipse at 50% 60%, rgba(180,220,200,0.1) 0%, transparent 60%),
    linear-gradient(180deg, #070f09 0%, #080f09 100%);
}
#viewer-container[data-bg="annimariage"] {
  background:radial-gradient(ellipse at 50% 60%, rgba(180,80,80,0.12) 0%, transparent 60%),
    linear-gradient(180deg, #0f0606 0%, #120707 100%);
}
#viewer-container[data-bg="gender"] {
  background:radial-gradient(ellipse at 30% 60%, rgba(220,130,180,0.1) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 60%, rgba(130,160,220,0.1) 0%, transparent 50%),
    linear-gradient(180deg, #080809 0%, #090809 100%);
}
/* Bokeh particles */
.bokeh {
  position:absolute; border-radius:50%; pointer-events:none;
  animation:float-bokeh linear infinite;
}
@keyframes float-bokeh {
  0% { transform:translateY(100vh) scale(0); opacity:0; }
  10% { opacity:1; }
  90% { opacity:0.6; }
  100% { transform:translateY(-20vh) scale(1); opacity:0; }
}

#viewers-wrap {
  display:flex; gap:24px; align-items:center; justify-content:center;
  width:100%; height:100%; padding:24px;
}
.viewer-slot { position:relative; display:flex; flex-direction:column; align-items:center; gap:8px; }
.viewer-iframe-wrap {
  border-radius:16px; overflow:hidden;
  box-shadow:0 20px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(201,169,110,0.1);
  transition:box-shadow 0.3s;
}
.viewer-iframe-wrap:hover { box-shadow:0 20px 80px rgba(0,0,0,0.9), 0 0 0 1px rgba(201,169,110,0.3); }
.viewer-iframe-wrap iframe { display:block; border:none; }
.viewer-label {
  font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase;
}

#viewer-hint {
  position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
  font-size:11px; color:rgba(201,169,110,0.4); letter-spacing:1px;
  pointer-events:none;
  animation:hint-pulse 3s ease-in-out infinite;
}
@keyframes hint-pulse { 0%,100%{opacity:0.4;} 50%{opacity:0.8;} }

/* Spotlight overlay */
#spotlight {
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse 500px 600px at 50% 45%, transparent 40%, rgba(0,0,0,0.7) 100%);
  z-index:5; opacity:0; transition:opacity 0.5s;
}
#spotlight.active { opacity:1; }

/* Bottom - bg selector */
#bg-bar {
  padding:12px 24px; border-top:1px solid var(--border);
  background:rgba(10,8,5,0.8); backdrop-filter:blur(10px);
  display:flex; align-items:center; gap:10px;
}
#bg-bar-label { font-size:10px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; margin-right:4px; }
.bg-btn {
  padding:5px 14px; border-radius:20px; border:1px solid var(--border);
  background:transparent; color:var(--muted); font-family:'Jost',sans-serif;
  font-size:11px; cursor:pointer; transition:all 0.2s; white-space:nowrap;
}
.bg-btn:hover { color:var(--text); border-color:rgba(201,169,110,0.4); }
.bg-btn.active { background:var(--gold-dim); border-color:var(--gold); color:var(--gold); }

/* Right panel */
#col-right {
  width:280px; flex-shrink:0;
  background:rgba(10,8,5,0.7); border-left:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
}
#right-scroll { flex:1; overflow-y:auto; padding:20px 16px; }
#right-scroll::-webkit-scrollbar { width:3px; }
#right-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

.rpanel-section { margin-bottom:24px; }
.rpanel-title {
  font-size:9px; letter-spacing:2.5px; text-transform:uppercase; color:var(--muted);
  margin-bottom:12px; display:flex; align-items:center; gap:8px;
}
.rpanel-title::after { content:''; flex:1; height:1px; background:var(--border); }

.live-textarea {
  width:100%; padding:10px 12px; background:rgba(201,169,110,0.04);
  border:1px solid var(--border); border-radius:8px;
  color:var(--text); font-family:'Jost',sans-serif; font-size:13px;
  outline:none; resize:none; transition:border-color 0.2s; line-height:1.5;
  margin-bottom:8px;
}
.live-textarea:focus { border-color:rgba(201,169,110,0.5); }
.live-zone-label { font-size:11px; color:var(--muted); margin-bottom:5px; }

/* Color swatches */
.live-swatches { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
.live-swatch {
  width:28px; height:28px; border-radius:50%; cursor:pointer;
  border:2px solid transparent; transition:all 0.2s;
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
}
.live-swatch:hover { transform:scale(1.15); }
.live-swatch.active { border-color:#fff; box-shadow:0 2px 12px rgba(0,0,0,0.6), 0 0 0 3px rgba(201,169,110,0.3); }
.swatch-name { font-size:11px; color:var(--muted); font-style:italic; min-height:16px; }

/* Saved colors */
.color-lib-wrap { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.color-lib-dot {
  width:22px; height:22px; border-radius:50%; cursor:pointer;
  border:1px solid rgba(255,255,255,0.1); transition:transform 0.15s;
}
.color-lib-dot:hover { transform:scale(1.2); }
.color-lib-add {
  width:22px; height:22px; border-radius:50%; background:var(--surface3);
  border:1px dashed var(--border); cursor:pointer; display:flex;
  align-items:center; justify-content:center; font-size:14px; color:var(--muted);
  transition:all 0.2s;
}
.color-lib-add:hover { color:var(--gold); border-color:var(--gold); }

/* Comparison toggle */
#btn-compare {
  width:100%; padding:9px; background:transparent; border:1px solid var(--border);
  border-radius:8px; color:var(--muted); font-family:'Jost',sans-serif;
  font-size:12px; cursor:pointer; transition:all 0.2s; margin-bottom:8px;
}
#btn-compare:hover, #btn-compare.active {
  border-color:var(--gold); color:var(--gold); background:var(--gold-dim);
}

/* PNG download */
#right-bottom {
  padding:16px; border-top:1px solid var(--border);
  background:rgba(10,8,5,0.8);
}
#png-name {
  width:100%; padding:9px 12px; background:rgba(201,169,110,0.04);
  border:1px solid var(--border); border-radius:8px;
  color:var(--text); font-family:'Jost',sans-serif; font-size:12px;
  outline:none; margin-bottom:10px; transition:border-color 0.2s;
}
#png-name:focus { border-color:rgba(201,169,110,0.5); }
#btn-download {
  width:100%; padding:12px; border:none; border-radius:10px; cursor:pointer;
  background:linear-gradient(135deg, #C9A96E, #E8D5A3, #C9A96E);
  background-size:200% 100%; background-position:100% 0;
  color:#0a0a0a; font-family:'Jost',sans-serif; font-size:13px; font-weight:700;
  letter-spacing:0.5px; transition:all 0.3s;
}
#btn-download:hover { background-position:0 0; transform:translateY(-1px); box-shadow:0 8px 24px rgba(201,169,110,0.25); }

/* Spotlight name display */
#design-spotlight {
  position:absolute; top:24px; left:50%; transform:translateX(-50%);
  text-align:center; z-index:10; pointer-events:none;
  opacity:0; transition:opacity 0.5s;
}
#design-spotlight.show { opacity:1; }
#design-spotlight-name {
  font-family:'Cormorant Garamond', serif;
  font-size:22px; font-style:italic; color:var(--gold-lt);
  text-shadow:0 2px 20px rgba(0,0,0,0.8);
}
#design-spotlight-sub { font-size:10px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-top:4px; }
</style>
</head>
<body>

<!-- ── LOCK SCREEN ──────────────────────────────────────────────── -->
<div id="lock-screen">
  <div id="lock-box">
    <div id="lock-brand">KUZTOM</div>
    <div id="lock-sub">Studio Live</div>
    <div id="lock-divider"></div>
    <input type="password" id="lock-input" placeholder="••••••••" autocomplete="off">
    <button id="lock-btn">Accéder au Studio</button>
    <div id="lock-error"></div>
    <div id="lock-info"></div>
  </div>
</div>

<!-- ── MAIN APP ─────────────────────────────────────────────────── -->
<div id="app">
  <div id="topbar">
    <div id="topbar-brand">KUZTOM</div>
    <span id="topbar-tag">Studio Live</span>
    <div class="live-dot"></div>
    <button id="btn-live-pwd" style="padding:5px 12px;background:rgba(201,169,110,0.08);border:1px solid rgba(201,169,110,0.2);border-radius:20px;color:rgba(201,169,110,0.7);font-family:Jost,sans-serif;font-size:11px;cursor:pointer;transition:all 0.2s;" onmouseenter="this.style.color='#c9a96e'" onmouseleave="this.style.color='rgba(201,169,110,0.7)'">🔑 Mot de passe</button>
  </div>
  <div id="layout">
    <!-- Gallery -->
    <div id="col-gallery">
      <div id="gallery-header">Designs disponibles</div>
      <input type="text" id="gallery-search" placeholder="Rechercher...">
      <div id="gallery-list"></div>
    </div>

    <!-- Center viewer -->
    <div id="col-center">
      <div id="viewer-container" data-bg="mariage">
        <div id="spotlight"></div>
        <div id="design-spotlight">
          <div id="design-spotlight-name"></div>
          <div id="design-spotlight-sub">Visualisation en cours</div>
        </div>
        <div id="viewers-wrap">
          <div class="viewer-slot" id="slot-a">
            <div class="viewer-iframe-wrap" id="wrap-a">
              <iframe id="iframe-a" src="" width="420" height="420" scrolling="no"></iframe>
            </div>
            <div class="viewer-label" id="label-a"></div>
          </div>
          <div class="viewer-slot" id="slot-b" style="display:none">
            <div class="viewer-iframe-wrap" id="wrap-b">
              <iframe id="iframe-b" src="" width="300" height="300" scrolling="no"></iframe>
            </div>
            <div class="viewer-label" id="label-b"></div>
          </div>
        </div>
        <div id="viewer-hint">↻ &nbsp;Glissez pour explorer à 360°</div>
      </div>
      <!-- Background selector -->
      <div id="bg-bar">
        <span id="bg-bar-label">Ambiance</span>
        <button class="bg-btn active" data-bg="mariage">💍 Mariage</button>
        <button class="bg-btn" data-bg="bapteme">🕊️ Baptême</button>
        <button class="bg-btn" data-bg="anniversaire">🎂 Anniversaire</button>
        <button class="bg-btn" data-bg="babyshower">👶 Baby Shower</button>
        <button class="bg-btn" data-bg="annimariage">💑 Anniv. Mariage</button>
        <button class="bg-btn" data-bg="gender">🎀 Gender Reveal</button>
      </div>
    </div>

    <!-- Right panel -->
    <div id="col-right">
      <div id="right-scroll">
        <!-- Textes -->
        <div class="rpanel-section" id="zones-container">
          <div class="rpanel-title">Personnalisation</div>
          <div style="color:var(--muted);font-size:12px;font-style:italic;">Sélectionnez un design</div>
        </div>

        <!-- Couleur gobelet -->
        <div class="rpanel-section" id="colors-section" style="display:none">
          <div class="rpanel-title">Couleur gobelet</div>
          <div class="live-swatches" id="live-swatches"></div>
          <div class="swatch-name" id="swatch-name"></div>
        </div>

        <!-- Bibliothèque couleurs texte -->
        <div class="rpanel-section">
          <div class="rpanel-title">Couleurs sauvegardées</div>
          <div class="color-lib-wrap" id="color-lib"></div>
        </div>

        <!-- Comparaison -->
        <div class="rpanel-section">
          <div class="rpanel-title">Options</div>
          <button id="btn-compare">⊞ Mode comparaison</button>
        </div>
      </div>

      <!-- Download -->
      <div id="right-bottom">
        <input type="text" id="png-name" placeholder="Nom du fichier PNG...">
        <button id="btn-download">📥 Télécharger PNG</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────
const DESIGNS_JSON = 'https://raw.githubusercontent.com/clcreation542-coder/Code-3D/main/designs.json';
const VIEWER_BASE  = 'https://clcreation542-coder.github.io/Code-3D/configurateur-viewer.html';
const VIEWER_ORIGIN= 'https://clcreation542-coder.github.io';
const DEPLOY_KEY   = 'kuztom_deployed_hashes';
const LIVE_LIB_KEY = 'kuztom_live_colors';
const LIVE_LOCK_KEY= 'kuztom_live_lock_until';
const LIVE_ATT_KEY = 'kuztom_live_attempts';
const LIVE_HASH_KEY= 'kuztom_live_ph';

// ── LOCK ──────────────────────────────────────────────────────────
(function(){
  function hash(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*0x01000193)>>>0;}return h.toString(16).padStart(8,'0')+(h^0xdeadbeef).toString(16).padStart(8,'0');}
  function simpleHash(s){return hash(s);}
  const DEFAULT=simpleHash('kuztom-live');
  function getHash(){return localStorage.getItem(LIVE_HASH_KEY)||DEFAULT;}
  function getAtt(){return parseInt(localStorage.getItem(LIVE_ATT_KEY)||'0');}
  function getLock(){return parseInt(localStorage.getItem(LIVE_LOCK_KEY)||'0');}

  const scr=document.getElementById('lock-screen');
  const inp=document.getElementById('lock-input');
  const btn=document.getElementById('lock-btn');
  const err=document.getElementById('lock-error');
  const info=document.getElementById('lock-info');

  function checkLock(){
    const u=getLock();
    if(u>Date.now()){
      const s=Math.ceil((u-Date.now())/1000);
      info.textContent='⏳ Bloqué — réessayez dans '+s+'s';
      btn.disabled=true;inp.disabled=true;
      setTimeout(checkLock,1000);
    } else {
      btn.disabled=false;inp.disabled=false;
      const a=getAtt();info.textContent=a>0?a+' tentative(s) échouée(s)':'';
    }
  }

  function tryLogin(){
    if(getLock()>Date.now())return;
    if(!inp.value)return;
    if(simpleHash(inp.value)===getHash()){
      localStorage.removeItem(LIVE_ATT_KEY);localStorage.removeItem(LIVE_LOCK_KEY);
      sessionStorage.setItem('kuztom_live_auth','ok');
      scr.style.transition='opacity 0.6s';scr.style.opacity='0';
      setTimeout(()=>{scr.remove();document.getElementById('app').classList.add('visible');initApp();},600);
    } else {
      let a=getAtt()+1;localStorage.setItem(LIVE_ATT_KEY,a);
      if(a>=3){localStorage.setItem(LIVE_LOCK_KEY,Date.now()+5*60*1000);localStorage.setItem(LIVE_ATT_KEY,'0');checkLock();}
      else{err.textContent='❌ Mot de passe incorrect';info.textContent=(3-a)+' tentative(s) restante(s)';inp.value='';inp.focus();}
    }
  }

  if(sessionStorage.getItem('kuztom_live_auth')==='ok'){
    scr.remove();document.getElementById('app').classList.add('visible');
    document.addEventListener('DOMContentLoaded',initApp);
    if(document.readyState!=='loading')initApp();
  } else {
    btn.addEventListener('click',tryLogin);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
    checkLock();
  }
})();

// ── APP ───────────────────────────────────────────────────────────
let designs=[], currentDesign=null, compareMode=false;
let deployedHashes={};
let imgCache={};

function post(data, target='a'){
  const ifr = target==='a' ? document.getElementById('iframe-a') : document.getElementById('iframe-b');
  if(ifr&&ifr.contentWindow) ifr.contentWindow.postMessage(data, VIEWER_ORIGIN);
}

function getDeployedHashes(){
  try{return JSON.parse(localStorage.getItem(DEPLOY_KEY))||{};}catch{return{};}
}
function designHash(d){
  return JSON.stringify({color:d.gobelet_color,opacity:d.gobelet_opacity,tz:d.text_zones,pz:d.photo_zones,vc:d.variant_colors});
}
function isDeployed(d){
  const h=getDeployedHashes();
  return h[d.id]&&h[d.id]===designHash(d);
}

// Bokeh particles
function createBokeh(){
  const container=document.getElementById('viewer-container');
  const colors=['rgba(201,169,110,0.3)','rgba(255,255,255,0.15)','rgba(201,169,110,0.15)'];
  for(let i=0;i<12;i++){
    const b=document.createElement('div');
    b.className='bokeh';
    const size=Math.random()*60+10;
    b.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;bottom:-20px;
      background:radial-gradient(circle,${colors[i%3]} 0%,transparent 70%);
      animation-duration:${8+Math.random()*12}s;
      animation-delay:${Math.random()*10}s;
      filter:blur(${size/3}px);`;
    container.appendChild(b);
  }
}

function setBackground(bg){
  document.getElementById('viewer-container').setAttribute('data-bg',bg);
  document.querySelectorAll('.bg-btn').forEach(b=>b.classList.toggle('active',b.dataset.bg===bg));
}

function renderGallery(query=''){
  const list=document.getElementById('gallery-list');
  const filtered=designs.filter(d=>!query||d.name.toLowerCase().includes(query.toLowerCase()));
  list.innerHTML=filtered.map(d=>`
    <div class="gallery-card${currentDesign&&currentDesign.id===d.id?' active':''}" data-id="${d.id}">
      <div class="gallery-card-thumb"><canvas id="lth-${d.id}" width="200" height="70"></canvas></div>
      <div class="gallery-card-name">${d.name}</div>
    </div>
  `).join('');
  list.querySelectorAll('.gallery-card').forEach(card=>{
    card.addEventListener('click',()=>selectDesign(designs.find(d=>d.id===card.dataset.id)));
  });
  // Rendu des thumbnails
  filtered.forEach(d=>{
    const canvas=document.getElementById('lth-'+d.id);
    if(!canvas)return;
    const c=canvas.getContext('2d');
    c.fillStyle='#1a1a1a';c.fillRect(0,0,200,70);
    const img=imgCache[d.id];
    if(img){c.drawImage(img,0,0,200,70);}
    else{
      c.fillStyle='rgba(201,169,110,0.2)';c.fillRect(0,0,200,70);
      c.fillStyle='rgba(201,169,110,0.5)';c.font='11px Jost';c.textAlign='center';c.textBaseline='middle';
      c.fillText(d.name.substring(0,20),100,35);
    }
  });
}

function loadDesignImg(d){
  if(imgCache[d.id]||!d.design)return;
  if(d.design&&d.design.startsWith&&d.design.startsWith('data:')){
    const img=new Image();
    img.onload=()=>{imgCache[d.id]=img;renderGallery(document.getElementById('gallery-search').value);};
    img.src=d.design;
  }
}

function selectDesign(d){
  if(!d)return;
  currentDesign=d;
  renderGallery(document.getElementById('gallery-search').value);
  // Spotlight animation
  const sl=document.getElementById('spotlight');
  const spName=document.getElementById('design-spotlight-name');
  const spDiv=document.getElementById('design-spotlight');
  spName.textContent=d.name;
  sl.classList.add('active');spDiv.classList.add('show');
  setTimeout(()=>{sl.classList.remove('active');spDiv.classList.remove('show');},2500);
  // Charger viewer
  loadViewerA(d);
  // Zones texte
  buildZones(d);
  // Swatches couleur
  buildSwatches(d);
  // Nom PNG
  document.getElementById('png-name').value=d.name+'.png';
}

function getViewerUrl(d){
  return VIEWER_BASE+'?design='+encodeURIComponent(d.id)+'&v='+Date.now();
}

function loadViewerA(d){
  const ifr=document.getElementById('iframe-a');
  ifr.src=getViewerUrl(d);
}

function buildZones(d){
  const container=document.getElementById('zones-container');
  const zones=(d.text_zones||[]).slice().sort((a,b)=>(a.ordre||a.order||99)-(b.ordre||b.order||99));
  if(!zones.length){
    container.innerHTML='<div class="rpanel-title">Personnalisation</div><div style="color:var(--muted);font-size:12px;font-style:italic;">Aucune zone de texte</div>';
    return;
  }
  container.innerHTML='<div class="rpanel-title">Personnalisation</div>'+zones.map(z=>`
    <div style="margin-bottom:12px">
      <div class="live-zone-label">${z.label||z.id}</div>
      <textarea class="live-textarea" rows="2" data-zone-id="${z.id}" placeholder="${(z.placeholder||'').replace(/"/g,'&quot;')}">${z.placeholder||''}</textarea>
    </div>
  `).join('');
  container.querySelectorAll('.live-textarea').forEach(ta=>{
    // Envoyer placeholder initial
    post({type:'UPDATE_TEXT',zoneId:ta.dataset.zoneId,value:ta.value});
    ta.addEventListener('input',()=>post({type:'UPDATE_TEXT',zoneId:ta.dataset.zoneId,value:ta.value}));
  });
}

function buildSwatches(d){
  const section=document.getElementById('colors-section');
  const colors=d.variant_colors||[];
  if(!colors.length){section.style.display='none';return;}
  section.style.display='';
  const wrap=document.getElementById('live-swatches');
  const nameEl=document.getElementById('swatch-name');
  wrap.innerHTML=colors.map((c,i)=>`
    <div class="live-swatch${i===0?' active':''}" data-i="${i}"
      style="background:${c.hex}" title="${c.name||c.hex}"></div>
  `).join('');
  nameEl.textContent=colors[0]?colors[0].name||colors[0].hex:'';
  // Premier swatch envoyé automatiquement
  if(colors[0])post({type:'UPDATE_COLOR',value:colors[0].hex,opacity:colors[0].opacity??0.88,textColorOverride:colors[0].force_text_color?colors[0].text_color_override:null});
  wrap.querySelectorAll('.live-swatch').forEach(s=>{
    s.addEventListener('click',()=>{
      wrap.querySelectorAll('.live-swatch').forEach(x=>x.classList.remove('active'));
      s.classList.add('active');
      const c=colors[+s.dataset.i];
      nameEl.textContent=c.name||c.hex;
      post({type:'UPDATE_COLOR',value:c.hex,opacity:c.opacity??0.88,textColorOverride:c.force_text_color?c.text_color_override:null});
      if(compareMode){
        const c2=colors[(+s.dataset.i+1)%colors.length];
        post({type:'UPDATE_COLOR',value:c2.hex,opacity:c2.opacity??0.88},'b');
        document.getElementById('label-b').textContent=c2.name||c2.hex;
      }
      document.getElementById('label-a').textContent=c.name||c.hex;
    });
  });
}

// Bibliothèque couleurs
function getColorLib(){try{return JSON.parse(localStorage.getItem(LIVE_LIB_KEY))||[];}catch{return[];}}
function renderColorLib(){
  const lib=getColorLib();
  const wrap=document.getElementById('color-lib');
  wrap.innerHTML=lib.map((c,i)=>`<div class="color-lib-dot" style="background:${c}" data-c="${c}" data-i="${i}" title="${c}"></div>`).join('')
    +'<div class="color-lib-add" id="lib-add-btn" title="Ajouter couleur">+</div>';
  wrap.querySelectorAll('.color-lib-dot').forEach(d=>{
    d.addEventListener('click',()=>{
      // Appliquer comme couleur de fond custom
    });
    d.addEventListener('contextmenu',e=>{
      e.preventDefault();
      const l=getColorLib();l.splice(+d.dataset.i,1);
      localStorage.setItem(LIVE_LIB_KEY,JSON.stringify(l));renderColorLib();
    });
  });
  document.getElementById('lib-add-btn').addEventListener('click',()=>{
    const hex=prompt('Code couleur hex (#rrggbb)');
    if(hex&&/^#[0-9a-fA-F]{6}$/.test(hex)){
      const l=getColorLib();if(!l.includes(hex))l.push(hex);
      localStorage.setItem(LIVE_LIB_KEY,JSON.stringify(l));renderColorLib();
    }
  });
}

// Comparaison
document.getElementById('btn-compare').addEventListener('click',()=>{
  compareMode=!compareMode;
  document.getElementById('btn-compare').classList.toggle('active',compareMode);
  const slotB=document.getElementById('slot-b');
  const wrapA=document.getElementById('wrap-a');
  const ifrA=document.getElementById('iframe-a');
  if(compareMode){
    slotB.style.display='';
    ifrA.width=300;ifrA.height=300;
    wrapA.querySelector('iframe').width=300;
    // Charger 2ème viewer avec couleur différente
    if(currentDesign){
      const ifrB=document.getElementById('iframe-b');
      ifrB.src=getViewerUrl(currentDesign);
      const colors=currentDesign.variant_colors||[];
      if(colors[1]){
        document.getElementById('label-a').textContent=colors[0]?colors[0].name||colors[0].hex:'';
        document.getElementById('label-b').textContent=colors[1].name||colors[1].hex;
        setTimeout(()=>post({type:'UPDATE_COLOR',value:colors[1].hex,opacity:colors[1].opacity??0.88},'b'),2000);
      }
    }
  } else {
    slotB.style.display='none';
    ifrA.width=420;ifrA.height=420;
    document.getElementById('label-a').textContent='';
  }
});

// Téléchargement PNG
document.getElementById('btn-download').addEventListener('click',()=>{
  if(!currentDesign){alert('Sélectionnez d\'abord un design');return;}
  const btn=document.getElementById('btn-download');
  btn.textContent='⏳ Génération...';btn.disabled=true;
  post({type:'REQUEST_SHARE_IMAGE'});
  setTimeout(()=>{btn.textContent='📥 Télécharger PNG';btn.disabled=false;},5000);
});

// Recevoir image du viewer
window.addEventListener('message',e=>{
  if(!e.data)return;
  if(e.data.type==='SHARE_IMAGE_READY'){
    const btn=document.getElementById('btn-download');
    btn.textContent='📥 Télécharger PNG';btn.disabled=false;
    let name=document.getElementById('png-name').value.trim()||'gobelet-kuztom';
    if(!name.endsWith('.png'))name+='.png';
    const a=document.createElement('a');a.href=e.data.dataUrl;a.download=name;a.click();
  }
  if(e.data.type==='SHARE_IMAGE_ERROR'){
    const btn=document.getElementById('btn-download');btn.textContent='📥 Télécharger PNG';btn.disabled=false;
  }
});

// Background selector
document.querySelectorAll('.bg-btn').forEach(btn=>{
  btn.addEventListener('click',()=>setBackground(btn.dataset.bg));
});

// Gallery search
document.getElementById('gallery-search').addEventListener('input',e=>renderGallery(e.target.value));

// ── CHANGEMENT MOT DE PASSE LIVE ────────────────────────────────
document.getElementById('btn-live-pwd').addEventListener('click', ()=>{
  function hash(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*0x01000193)>>>0;}return h.toString(16).padStart(8,'0')+(h^0xdeadbeef).toString(16).padStart(8,'0');}
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:99998;display:flex;align-items:center;justify-content:center;font-family:Jost,sans-serif;';
  overlay.innerHTML=`<div style="background:#111;border:1px solid rgba(201,169,110,0.25);border-radius:20px;padding:40px;width:380px;text-align:center">
    <div style="color:#c9a96e;font-size:16px;font-weight:700;margin-bottom:8px">🔑 Changer le mot de passe Live</div>
    <div style="color:rgba(240,234,224,0.4);font-size:11px;margin-bottom:24px">Ce mot de passe est différent de celui de votre admin</div>
    <input id="lpwd-current" type="password" placeholder="Mot de passe actuel" style="width:100%;padding:11px;background:rgba(201,169,110,0.04);border:1px solid rgba(201,169,110,0.2);border-radius:8px;color:#f0eae0;font-size:13px;box-sizing:border-box;outline:none;margin-bottom:10px;font-family:Jost,sans-serif">
    <input id="lpwd-new" type="password" placeholder="Nouveau mot de passe" style="width:100%;padding:11px;background:rgba(201,169,110,0.04);border:1px solid rgba(201,169,110,0.2);border-radius:8px;color:#f0eae0;font-size:13px;box-sizing:border-box;outline:none;margin-bottom:10px;font-family:Jost,sans-serif">
    <input id="lpwd-confirm" type="password" placeholder="Confirmer" style="width:100%;padding:11px;background:rgba(201,169,110,0.04);border:1px solid rgba(201,169,110,0.2);border-radius:8px;color:#f0eae0;font-size:13px;box-sizing:border-box;outline:none;margin-bottom:14px;font-family:Jost,sans-serif">
    <div id="lpwd-err" style="font-size:12px;color:#e06c75;min-height:18px;margin-bottom:10px"></div>
    <div style="display:flex;gap:8px">
      <button id="lpwd-cancel" style="flex:1;padding:10px;background:#1e1e1e;border:none;border-radius:8px;color:#f0eae0;cursor:pointer;font-family:Jost,sans-serif">Annuler</button>
      <button id="lpwd-ok" style="flex:2;padding:10px;background:linear-gradient(135deg,#c9a96e,#e8d5a3);border:none;border-radius:8px;color:#0a0a0a;font-weight:700;cursor:pointer;font-family:Jost,sans-serif">Changer</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('lpwd-cancel').onclick=()=>document.body.removeChild(overlay);
  document.getElementById('lpwd-ok').onclick=()=>{
    const cur=document.getElementById('lpwd-current').value;
    const nw=document.getElementById('lpwd-new').value;
    const conf=document.getElementById('lpwd-confirm').value;
    const stored=localStorage.getItem(LIVE_HASH_KEY)||hash('kuztom-live');
    if(hash(cur)!==stored){document.getElementById('lpwd-err').textContent='❌ Mot de passe actuel incorrect';return;}
    if(nw.length<6){document.getElementById('lpwd-err').textContent='❌ Minimum 6 caractères';return;}
    if(nw!==conf){document.getElementById('lpwd-err').textContent='❌ Les mots de passe ne correspondent pas';return;}
    localStorage.setItem(LIVE_HASH_KEY,hash(nw));
    document.body.removeChild(overlay);
    alert('✅ Mot de passe Live changé avec succès !');
  };
});

// ── INIT ──────────────────────────────────────────────────────────
function initApp(){
  createBokeh();
  renderColorLib();
  // Charger les designs (verts uniquement)
  fetch(DESIGNS_JSON+'?t='+Date.now())
    .then(r=>r.ok?r.json():Promise.reject('Erreur'))
    .then(data=>{
      const hashes=getDeployedHashes();
      // Garder seulement les designs déployés et à jour (points verts)
      designs=data.filter(d=>{
        if(!d.shopify_handle)return false;
        if(!hashes[d.id])return false;
        return hashes[d.id]===designHash(d);
      }).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
      designs.forEach(d=>loadDesignImg(d));
      renderGallery();
      if(designs.length>0)selectDesign(designs[0]);
    })
    .catch(()=>{
      document.getElementById('gallery-list').innerHTML='<div style="padding:16px;color:var(--muted);font-size:12px">Erreur de chargement</div>';
    });
}
</script>
