<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuztom — Studio Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#100E0B;
  --surface:#181410;
  --surface2:#201C17;
  --surface3:#2A241E;
  --gold:#C9A96E;
  --gold-lt:#E8D5A3;
  --gold-dim:rgba(201,169,110,0.12);
  --text:#F0E8D8;
  --muted:rgba(240,232,216,0.42);
  --border:rgba(201,169,110,0.16);
  --border2:rgba(240,232,216,0.08);
  --danger:#E06C75;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Jost',sans-serif;font-size:13px;}

/* LOCK */
#lock-screen{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 50% 35%,#1E180F 0%,#080604 70%);display:flex;align-items:center;justify-content:center;}
#lock-box{background:rgba(16,12,8,0.95);border:1px solid rgba(201,169,110,0.22);border-radius:24px;padding:52px 44px;width:380px;text-align:center;box-shadow:0 0 100px rgba(201,169,110,0.05),0 40px 80px rgba(0,0,0,0.7);}
#lock-brand{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;color:var(--gold);letter-spacing:6px;margin-bottom:4px;}
#lock-sub{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;}
#lock-line{width:36px;height:1px;background:var(--gold);margin:0 auto 32px;opacity:0.4;}
#lock-input{width:100%;padding:14px 18px;background:rgba(201,169,110,0.05);border:1px solid rgba(201,169,110,0.18);border-radius:10px;color:var(--text);font-size:15px;font-family:'Jost',sans-serif;text-align:center;letter-spacing:4px;outline:none;transition:border-color 0.3s;margin-bottom:12px;}
#lock-input:focus{border-color:var(--gold);}
#lock-btn{width:100%;padding:13px;border:none;border-radius:10px;cursor:pointer;background:linear-gradient(135deg,#C9A96E,#E8D5A3,#C9A96E);background-size:200% 100%;background-position:100% 0;color:#0a0805;font-family:'Jost',sans-serif;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;transition:background-position 0.4s;}
#lock-btn:hover{background-position:0 0;}
#lock-error{font-size:12px;color:var(--danger);margin-top:12px;min-height:18px;}
#lock-info{font-size:10px;color:var(--muted);margin-top:6px;}

/* APP */
#app{display:none;height:100vh;flex-direction:column;}
#app.visible{display:flex;}

/* TOPBAR */
#topbar{height:54px;flex-shrink:0;background:rgba(8,6,4,0.95);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;backdrop-filter:blur(12px);z-index:100;}
#topbar-brand{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--gold);letter-spacing:4px;margin-right:auto;}
.live-tag{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);background:rgba(201,169,110,0.1);border:1px solid rgba(201,169,110,0.18);border-radius:20px;padding:3px 10px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#E85D5D;box-shadow:0 0 8px #E85D5D;animation:pulse-red 1.5s infinite;flex-shrink:0;}
@keyframes pulse-red{0%,100%{opacity:1;}50%{opacity:0.35;}}
.top-btn{padding:5px 12px;background:rgba(201,169,110,0.07);border:1px solid var(--border);border-radius:20px;color:var(--muted);font-family:'Jost',sans-serif;font-size:11px;cursor:pointer;transition:all 0.2s;}
.top-btn:hover{color:var(--gold);border-color:rgba(201,169,110,0.4);}

/* LAYOUT */
#layout{display:flex;flex:1;overflow:hidden;}

/* GALLERY */
#col-gallery{width:200px;flex-shrink:0;background:rgba(8,6,4,0.7);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
#gallery-header{padding:12px 14px;border-bottom:1px solid var(--border);font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);}
#gallery-search{width:100%;padding:9px 14px;background:transparent;border:none;border-bottom:1px solid var(--border2);color:var(--text);font-family:'Jost',sans-serif;font-size:12px;outline:none;}
#gallery-search::placeholder{color:var(--muted);}
#gallery-list{flex:1;overflow-y:auto;padding:6px;}
#gallery-list::-webkit-scrollbar{width:2px;}
#gallery-list::-webkit-scrollbar-thumb{background:var(--border);}

.gallery-card{padding:8px;margin-bottom:6px;border:1px solid transparent;border-radius:10px;cursor:pointer;transition:all 0.2s;}
.gallery-card:hover{background:var(--gold-dim);border-color:var(--border);}
.gallery-card.active{background:rgba(201,169,110,0.1);border-color:rgba(201,169,110,0.35);box-shadow:0 0 16px rgba(201,169,110,0.05);}
.gallery-thumb{width:100%;height:72px;border-radius:6px;overflow:hidden;background:#1a1610;border:1px solid rgba(255,255,255,0.04);margin-bottom:7px;}
.gallery-thumb canvas{display:block;width:100%;height:100%;}
.gallery-name{font-size:11px;color:var(--text);line-height:1.3;}

/* CENTER */
#col-center{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;}

/* VIEWER CONTAINER */
#viewer-container{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;transition:background 0.8s ease;}
#viewer-container[data-bg="mariage"]{background:radial-gradient(ellipse 80% 60% at 50% 55%,rgba(220,190,140,0.09) 0%,transparent 70%),linear-gradient(180deg,#120E08 0%,#0E0B06 100%);}
#viewer-container[data-bg="bapteme"]{background:radial-gradient(ellipse 80% 60% at 50% 55%,rgba(160,190,230,0.1) 0%,transparent 70%),linear-gradient(180deg,#090C14 0%,#07090F 100%);}
#viewer-container[data-bg="anniversaire"]{background:radial-gradient(ellipse 80% 60% at 50% 55%,rgba(230,140,180,0.1) 0%,transparent 70%),linear-gradient(180deg,#140810 0%,#0F060B 100%);}
#viewer-container[data-bg="babyshower"]{background:radial-gradient(ellipse 80% 60% at 30% 55%,rgba(200,230,210,0.09) 0%,transparent 50%),radial-gradient(ellipse 60% 50% at 70% 55%,rgba(230,180,200,0.09) 0%,transparent 50%),linear-gradient(180deg,#0A100C 0%,#080C09 100%);}
#viewer-container[data-bg="annimariage"]{background:radial-gradient(ellipse 80% 60% at 50% 55%,rgba(190,90,90,0.1) 0%,transparent 70%),linear-gradient(180deg,#140808 0%,#0F0606 100%);}
#viewer-container[data-bg="gender"]{background:radial-gradient(ellipse 60% 60% at 30% 55%,rgba(220,140,180,0.09) 0%,transparent 50%),radial-gradient(ellipse 60% 60% at 70% 55%,rgba(140,170,230,0.09) 0%,transparent 50%),linear-gradient(180deg,#0A090F 0%,#08080C 100%);}

/* Particules bokeh */
.bokeh{position:absolute;border-radius:50%;pointer-events:none;animation:bokeh-float linear infinite;}
@keyframes bokeh-float{0%{transform:translateY(110vh) scale(0.2);opacity:0;}10%{opacity:0.8;}85%{opacity:0.4;}100%{transform:translateY(-15vh) scale(1);opacity:0;}}

#viewers-wrap{display:flex;gap:20px;align-items:center;justify-content:center;width:100%;height:100%;padding:16px;}
.viewer-slot{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;}
.viewer-slot.primary .viewer-frame{box-shadow:0 24px 80px rgba(0,0,0,0.85),0 0 0 2px rgba(201,169,110,0.35);}
.viewer-frame{border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.8),0 0 0 1px rgba(201,169,110,0.1);transition:all 0.3s;}
.viewer-frame:hover{box-shadow:0 24px 70px rgba(0,0,0,0.9),0 0 0 1px rgba(201,169,110,0.3);}
.viewer-frame iframe{display:block;border:none;}
.viewer-slot-label{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}

/* Spotlight */
#spotlight{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 500px 600px at 50% 45%,transparent 35%,rgba(0,0,0,0.65) 100%);z-index:5;opacity:0;transition:opacity 0.5s;}
#spotlight.on{opacity:1;}
#design-name-display{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center;z-index:10;pointer-events:none;opacity:0;transition:opacity 0.4s;}
#design-name-display.show{opacity:1;}
#design-name-text{font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;color:var(--gold-lt);text-shadow:0 2px 16px rgba(0,0,0,0.9);}

/* Zoom overlay */
#zoom-overlay{display:none;position:fixed;inset:0;z-index:9000;background:rgba(6,4,2,0.95);align-items:center;justify-content:center;cursor:zoom-out;}
#zoom-overlay.open{display:flex;}
#zoom-overlay iframe{border:none;border-radius:16px;box-shadow:0 30px 100px rgba(0,0,0,0.9);}
#zoom-close{position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:50%;background:rgba(201,169,110,0.1);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
#zoom-close:hover{background:rgba(201,169,110,0.2);color:var(--gold);}

/* Hint */
#viewer-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(201,169,110,0.35);letter-spacing:1px;pointer-events:none;animation:hint-pulse 3s ease-in-out infinite;}
@keyframes hint-pulse{0%,100%{opacity:0.35;}50%{opacity:0.75;}}

/* BG BAR */
#bg-bar{padding:10px 20px;border-top:1px solid var(--border);background:rgba(8,6,4,0.85);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#bg-bar-lbl{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-right:4px;}
.bg-btn{padding:4px 12px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-family:'Jost',sans-serif;font-size:11px;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.bg-btn:hover{color:var(--text);border-color:var(--border);}
.bg-btn.active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold);}

/* RIGHT PANEL */
#col-right{width:272px;flex-shrink:0;background:rgba(8,6,4,0.75);border-left:1px solid var(--border);display:flex;flex-direction:column;}
#right-scroll{flex:1;overflow-y:auto;padding:18px 14px;}
#right-scroll::-webkit-scrollbar{width:2px;}
#right-scroll::-webkit-scrollbar-thumb{background:var(--border);}

.rp-section{margin-bottom:22px;}
.rp-title{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.rp-title::after{content:'';flex:1;height:1px;background:var(--border2);}

.live-ta{width:100%;padding:9px 11px;background:rgba(201,169,110,0.04);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Jost',sans-serif;font-size:13px;outline:none;resize:none;line-height:1.5;margin-bottom:7px;transition:border-color 0.2s;cursor:text;}
.live-ta:focus{border-color:rgba(201,169,110,0.45);}
.zone-lbl{font-size:11px;color:var(--muted);margin-bottom:4px;}

/* SWATCHES */
.swatches-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px;}
.live-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all 0.2s;box-shadow:0 2px 8px rgba(0,0,0,0.5);}
.live-swatch:hover{transform:scale(1.18);}
.live-swatch.active{border-color:#fff;box-shadow:0 2px 12px rgba(0,0,0,0.6),0 0 0 3px rgba(201,169,110,0.3);}
.live-swatch.dark-swatch{box-shadow:0 0 0 1.5px rgba(255,255,255,0.25),0 2px 8px rgba(0,0,0,0.5);}
.swatch-lbl{font-size:11px;color:var(--muted);font-style:italic;min-height:15px;}

/* COLOR LIB */
.color-lib-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
.clib-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:1px solid rgba(255,255,255,0.08);transition:transform 0.15s;box-shadow:0 1px 4px rgba(0,0,0,0.4);}
.clib-dot:hover{transform:scale(1.2);}
.clib-add{width:20px;height:20px;border-radius:50%;background:var(--surface3);border:1px dashed var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);transition:all 0.2s;}
.clib-add:hover{color:var(--gold);border-color:var(--gold);}

/* COMPARE BTN */
#btn-compare{width:100%;padding:8px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:'Jost',sans-serif;font-size:11px;cursor:pointer;transition:all 0.2s;margin-bottom:6px;}
#btn-compare:hover,#btn-compare.active{border-color:var(--gold);color:var(--gold);background:var(--gold-dim);}
#btn-autorot{width:100%;padding:8px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:'Jost',sans-serif;font-size:11px;cursor:pointer;transition:all 0.2s;}
#btn-autorot:hover,#btn-autorot.active{border-color:var(--gold);color:var(--gold);background:var(--gold-dim);}

/* PRESETS */
.preset-row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
.preset-chip{padding:4px 10px;background:var(--surface2);border:1px solid var(--border2);border-radius:16px;font-size:11px;color:var(--muted);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:5px;}
.preset-chip:hover{border-color:var(--gold);color:var(--gold);}
.preset-chip .del{color:var(--danger);font-size:10px;opacity:0.7;}
.preset-chip .del:hover{opacity:1;}
#btn-save-preset{width:100%;padding:8px;background:transparent;border:1px dashed var(--border);border-radius:8px;color:var(--muted);font-family:'Jost',sans-serif;font-size:11px;cursor:pointer;transition:all 0.2s;}
#btn-save-preset:hover{border-color:var(--gold);color:var(--gold);}

/* BOTTOM */
#right-bottom{padding:14px;border-top:1px solid var(--border);background:rgba(8,6,4,0.85);}
#png-name{width:100%;padding:9px 11px;background:rgba(201,169,110,0.04);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Jost',sans-serif;font-size:12px;outline:none;margin-bottom:9px;transition:border-color 0.2s;}
#png-name:focus{border-color:rgba(201,169,110,0.45);}
#btn-dl{width:100%;padding:11px;border:none;border-radius:10px;cursor:pointer;background:linear-gradient(135deg,#C9A96E,#E8D5A3,#C9A96E);background-size:200% 100%;background-position:100% 0;color:#0a0805;font-family:'Jost',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.5px;transition:all 0.3s;}
#btn-dl:hover{background-position:0 0;transform:translateY(-1px);box-shadow:0 8px 24px rgba(201,169,110,0.2);}
</style>
</head>
<body>

<!-- LOCK -->
<div id="lock-screen">
  <div id="lock-box">
    <div id="lock-brand">KUZTOM</div>
    <div id="lock-sub">Studio Live</div>
    <div id="lock-line"></div>
    <input type="password" id="lock-input" placeholder="••••••••" autocomplete="off">
    <button id="lock-btn">Accéder</button>
    <div id="lock-error"></div>
    <div id="lock-info"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="topbar">
    <div id="topbar-brand">KUZTOM</div>
    <span class="live-tag">Studio Live</span>
    <div class="live-dot"></div>
    <button class="top-btn" id="btn-pwd">🔑 Mot de passe</button>
  </div>
  <div id="layout">
    <!-- GALLERY -->
    <div id="col-gallery">
      <div id="gallery-header">Designs disponibles</div>
      <input type="text" id="gallery-search" placeholder="Rechercher...">
      <div id="gallery-list"></div>
    </div>

    <!-- CENTER -->
    <div id="col-center">
      <div id="viewer-container" data-bg="mariage">
        <div id="spotlight"></div>
        <div id="design-name-display"><div id="design-name-text"></div></div>
        <div id="viewers-wrap">
          <div class="viewer-slot primary" id="slot-a">
            <div class="viewer-frame" id="frame-a">
              <iframe id="iframe-a" src="" id="iframe-a" scrolling="no" style="display:block;border:none;width:min(100%,560px);height:min(100%,560px);"></iframe>
            </div>
            <div class="viewer-slot-label" id="lbl-a"></div>
          </div>
          <div class="viewer-slot" id="slot-b" style="display:none">
            <div class="viewer-frame" id="frame-b">
              <iframe id="iframe-b" src="" width="320" height="320" scrolling="no"></iframe>
            </div>
            <div class="viewer-slot-label" id="lbl-b"></div>
          </div>
        </div>
        <div id="viewer-hint">↻ &nbsp;Glissez pour explorer · Double-clic pour zoomer</div>
      </div>
      <div id="bg-bar">
        <span id="bg-bar-lbl">Ambiance</span>
        <button class="bg-btn active" data-bg="mariage">💍 Mariage</button>
        <button class="bg-btn" data-bg="bapteme">🕊️ Baptême</button>
        <button class="bg-btn" data-bg="anniversaire">🎂 Anniversaire</button>
        <button class="bg-btn" data-bg="babyshower">👶 Baby Shower</button>
        <button class="bg-btn" data-bg="annimariage">💑 Anniv. Mariage</button>
        <button class="bg-btn" data-bg="gender">🎀 Gender Reveal</button>
      </div>
    </div>

    <!-- RIGHT -->
    <div id="col-right">
      <div id="right-scroll">
        <div class="rp-section" id="zones-container">
          <div class="rp-title">Personnalisation</div>
          <div style="color:var(--muted);font-size:12px;font-style:italic;">Sélectionnez un design</div>
        </div>
        <div class="rp-section" id="colors-section" style="display:none">
          <div class="rp-title">Couleur gobelet</div>
          <div class="swatches-row" id="live-swatches"></div>
          <div class="swatch-lbl" id="swatch-lbl"></div>
        </div>
        <div class="rp-section">
          <div class="rp-title">Couleurs sauvegardées</div>
          <div class="color-lib-row" id="color-lib"></div>
        </div>
        <div class="rp-section">
          <div class="rp-title">Présets</div>
          <div class="preset-row" id="presets-row"></div>
          <button id="btn-save-preset">+ Sauvegarder cette configuration</button>
        </div>
        <div class="rp-section">
          <div class="rp-title">Options</div>
          <button id="btn-compare">⊞ Mode comparaison</button>
          <button id="btn-autorot" style="margin-top:6px">↻ Rotation automatique</button>
        </div>
      </div>
      <div id="right-bottom">
        <input type="text" id="png-name" placeholder="Nom du fichier PNG...">
        <button id="btn-dl">📥 Télécharger PNG</button>
      </div>
    </div>
  </div>
</div>

<!-- ZOOM -->
<div id="zoom-overlay">
  <button id="zoom-close">✕</button>
  <iframe id="iframe-zoom" src="" width="720" height="720" scrolling="no" style="border:none;border-radius:16px;"></iframe>
</div>

<script>
const DESIGNS_JSON='https://raw.githubusercontent.com/clcreation542-coder/Code-3D/main/designs.json';
const VIEWER_BASE='https://clcreation542-coder.github.io/Code-3D/configurateur-viewer.html';
const VIEWER_ORIGIN='https://clcreation542-coder.github.io';
const LIVE_LOCK_KEY='kuztom_live_lock_until';
const LIVE_ATT_KEY='kuztom_live_attempts';
const LIVE_HASH_KEY='kuztom_live_ph';
const LIVE_LIB_KEY='kuztom_live_colors';
const PRESETS_KEY='kuztom_live_presets';

/* Palette 35 couleurs événements */
const DEFAULT_COLORS = [
  '#ffffff','#F5F0EB','#EDE4D8','#D4C4A8','#C9A96E',
  '#F2E6D9','#F5C6C2','#F0A8A0','#E8849A','#D4175A',
  '#F9E4C8','#F5C896','#FFB347','#FF7A00','#E84C0A',
  '#E8F0E0','#C8E0C0','#A8C8A0','#4A9B4A','#1A8A2E',
  '#DCE8F5','#B0CCE8','#7AAED4','#247BDE','#1A3A8A',
  '#E8DCF0','#C8A8E0','#9B7ACC','#7B3AA0','#4A1A78',
  '#F5E8E8','#E0C0C0','#C08080','#8A4040','#090909',
];

// ── LOCK ─────────────────────────────────────────────────────────
(function(){
  function hash(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*0x01000193)>>>0;}return h.toString(16).padStart(8,'0')+(h^0xdeadbeef).toString(16).padStart(8,'0');}
  const DEFAULT=hash('kuztom-live');
  const scr=document.getElementById('lock-screen');
  const inp=document.getElementById('lock-input');
  const btn=document.getElementById('lock-btn');
  const err=document.getElementById('lock-error');
  const inf=document.getElementById('lock-info');
  function getH(){return localStorage.getItem(LIVE_HASH_KEY)||DEFAULT;}
  function getA(){return parseInt(localStorage.getItem(LIVE_ATT_KEY)||'0');}
  function getL(){return parseInt(localStorage.getItem(LIVE_LOCK_KEY)||'0');}
  function tick(){
    const u=getL();
    if(u>Date.now()){
      const s=Math.ceil((u-Date.now())/1000);
      inf.textContent='⏳ Bloqué — '+s+'s';
      btn.disabled=true;inp.disabled=true;setTimeout(tick,1000);
    }else{btn.disabled=false;inp.disabled=false;const a=getA();inf.textContent=a>0?a+' tentative(s) échouée(s)':'';}
  }
  function tryLogin(){
    if(getL()>Date.now())return;
    if(!inp.value)return;
    if(hash(inp.value)===getH()){
      localStorage.removeItem(LIVE_ATT_KEY);localStorage.removeItem(LIVE_LOCK_KEY);
      sessionStorage.setItem('kuztom_live_auth','ok');
      scr.style.transition='opacity 0.5s';scr.style.opacity='0';
      setTimeout(()=>{scr.remove();document.getElementById('app').classList.add('visible');initApp();},500);
    }else{
      let a=getA()+1;localStorage.setItem(LIVE_ATT_KEY,a);
      if(a>=3){localStorage.setItem(LIVE_LOCK_KEY,Date.now()+5*60*1000);localStorage.setItem(LIVE_ATT_KEY,'0');tick();}
      else{err.textContent='❌ Incorrect';inf.textContent=(3-a)+' tentative(s) restante(s)';inp.value='';inp.focus();}
    }
  }
  if(sessionStorage.getItem('kuztom_live_auth')==='ok'){
    scr.remove();document.getElementById('app').classList.add('visible');
    if(document.readyState!=='loading')initApp();else document.addEventListener('DOMContentLoaded',initApp);
  }else{btn.addEventListener('click',tryLogin);inp.addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});tick();}
})();

// ── APP ───────────────────────────────────────────────────────────
let designs=[],currentDesign=null,compareMode=false,autoRotating=false;
/* State indépendant par slot */
const slotState={
  a:{ texts:{}, color:null, opacity:0.88, font:{} },
  b:{ texts:{}, color:null, opacity:0.88, font:{} }
};
let imgCache={},selectedSlot='a';

function postTo(target,data){
  const ifr=document.getElementById('iframe-'+target);
  if(ifr&&ifr.contentWindow)ifr.contentWindow.postMessage(data,VIEWER_ORIGIN);
}
function postAll(data){postTo('a',data);if(compareMode)postTo('b',data);}

// Bokeh
function createBokeh(){
  const vc=document.getElementById('viewer-container');
  const cols=['rgba(201,169,110,0.25)','rgba(240,232,216,0.12)','rgba(180,140,80,0.2)'];
  for(let i=0;i<14;i++){
    const b=document.createElement('div');b.className='bokeh';
    const sz=Math.random()*70+15;
    b.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:-20px;
      background:radial-gradient(circle,${cols[i%3]} 0%,transparent 70%);
      animation-duration:${9+Math.random()*14}s;animation-delay:${Math.random()*12}s;
      filter:blur(${sz/3}px);`;
    vc.appendChild(b);
  }
}

// Fond ambiance
document.querySelectorAll('.bg-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.getElementById('viewer-container').setAttribute('data-bg',b.dataset.bg);
    document.querySelectorAll('.bg-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  });
});

// Gallery
function renderGallery(q=''){
  const list=document.getElementById('gallery-list');
  const items=designs.filter(d=>!q||d.name.toLowerCase().includes(q.toLowerCase()));
  list.innerHTML=items.map(d=>`
    <div class="gallery-card${currentDesign&&currentDesign.id===d.id?' active':''}" data-id="${d.id}">
      <div class="gallery-thumb"><canvas id="lth-${d.id}" width="188" height="72"></canvas></div>
      <div class="gallery-name">${d.name}</div>
    </div>
  `).join('');
  list.querySelectorAll('.gallery-card').forEach(card=>{
    card.addEventListener('click',()=>selectDesign(designs.find(d=>d.id===card.dataset.id)));
  });
  items.forEach(d=>drawThumb(d));
}

function drawThumb(d){
  const canvas=document.getElementById('lth-'+d.id);if(!canvas)return;
  const c=canvas.getContext('2d');
  c.fillStyle='#1A1610';c.fillRect(0,0,188,72);
  const img=imgCache[d.id];
  if(img){
    c.drawImage(img,0,0,188,72);
  }else{
    c.fillStyle='rgba(201,169,110,0.15)';c.fillRect(0,0,188,72);
    c.fillStyle='rgba(201,169,110,0.5)';c.font='10px Jost';c.textAlign='center';c.textBaseline='middle';
    c.fillText(d.name.substring(0,22),94,36);
  }
}

function loadImg(d){
  if(imgCache[d.id])return;
  /* Chercher l'image dans design (base64) ou design_url */
  const src=d.design||(d.design_url||null);
  if(!src)return;
  const img=new Image();
  img.crossOrigin='anonymous';
  img.onload=()=>{imgCache[d.id]=img;drawThumb(d);};
  img.onerror=()=>{
    /* Retry sans crossOrigin si besoin */
    const img2=new Image();
    img2.onload=()=>{imgCache[d.id]=img2;drawThumb(d);};
    img2.src=src;
  };
  img.src=src;
}

// Select design
function selectDesign(d){
  if(!d)return;
  currentDesign=d;
  renderGallery(document.getElementById('gallery-search').value);
  // Spotlight
  document.getElementById('design-name-text').textContent=d.name;
  const sl=document.getElementById('spotlight');
  const nd=document.getElementById('design-name-display');
  sl.classList.add('on');nd.classList.add('show');
  setTimeout(()=>{sl.classList.remove('on');nd.classList.remove('show');},2200);
  // Viewer
  const url=VIEWER_BASE+'?design='+encodeURIComponent(d.id)+'&v='+Date.now();
  document.getElementById('iframe-a').src=url;
  if(compareMode)document.getElementById('iframe-b').src=url;
  document.getElementById('iframe-zoom').src=url;
  // Zones
  buildZones(d);
  buildSwatches(d);
  document.getElementById('png-name').value=d.name+'.png';
  // Auto rotate
  if(autoRotating){setTimeout(()=>postAll({type:'SET_AUTO_ROTATE',value:true,speed:0.003}),2500);}
}

const LIVE_FONTS=['Allura','Cormorant Garamond','Dancing Script','EB Garamond','Great Vibes','Jost','Montserrat','Open Sans','Parisienne','Playfair Display','Sacramento','Satisfy','Tangerine'];

function buildZones(d){
  const c=document.getElementById('zones-container');
  const zones=(d.text_zones||[]).slice().sort((a,b)=>(a.ordre||a.order||99)-(b.ordre||b.order||99));
  /* Indicateur slot actif */
  const slotInd=compareMode?`<div style="font-size:10px;color:var(--gold);margin-bottom:10px;padding:5px 10px;background:var(--gold-dim);border-radius:6px;text-align:center;">Édition : Gobelet ${selectedSlot.toUpperCase()}</div>`:'';
  if(!zones.length){c.innerHTML='<div class="rp-title">Personnalisation</div>'+slotInd+'<div style="color:var(--muted);font-size:12px;font-style:italic;">Aucune zone</div>';return;}
  const st=slotState[selectedSlot];
  c.innerHTML='<div class="rp-title">Personnalisation</div>'+slotInd+zones.map(z=>`
    <div style="margin-bottom:12px">
      <div class="zone-lbl">${z.label||z.id}</div>
      <textarea class="live-ta" rows="2" data-zid="${z.id}">${st.texts[z.id]!==undefined?st.texts[z.id]:(z.placeholder||'')}</textarea>
      <select class="live-font-sel" data-zid="${z.id}" style="width:100%;margin-top:4px;padding:6px 8px;background:rgba(201,169,110,0.04);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-family:'Jost',sans-serif;font-size:11px;outline:none;cursor:pointer;">
        ${LIVE_FONTS.map(f=>`<option value="${f}" ${(st.font[z.id]||z.font_family||'Dancing Script')===f?'selected':''}>${f}</option>`).join('')}
      </select>
    </div>
  `).join('');
  c.querySelectorAll('.live-ta').forEach(ta=>{
    postTo(selectedSlot,{type:'UPDATE_TEXT',zoneId:ta.dataset.zid,value:ta.value});
    ta.addEventListener('input',()=>{
      slotState[selectedSlot].texts[ta.dataset.zid]=ta.value;
      postTo(selectedSlot,{type:'UPDATE_TEXT',zoneId:ta.dataset.zid,value:ta.value});
    });
  });
  c.querySelectorAll('.live-font-sel').forEach(sel=>{
    sel.addEventListener('change',()=>{
      slotState[selectedSlot].font[sel.dataset.zid]=sel.value;
      /* Envoyer changement de police via UPDATE_ZONE_FONT si supporté, sinon via reload */
    });
  });
}

function buildSwatches(d){
  const sec=document.getElementById('colors-section');
  const colors=d.variant_colors||[];
  if(!colors.length){sec.style.display='none';return;}
  sec.style.display='';
  const wrap=document.getElementById('live-swatches');
  const lbl=document.getElementById('swatch-lbl');
  wrap.innerHTML=colors.map((c,i)=>{
    const isDark=c.hex&&parseInt(c.hex.slice(1,3),16)<60&&parseInt(c.hex.slice(3,5),16)<60&&parseInt(c.hex.slice(5,7),16)<60;
    return `<div class="live-swatch${i===0?' active':''}${isDark?' dark-swatch':''}" data-i="${i}" style="background:${c.hex}" title="${c.name||c.hex}"></div>`;
  }).join('');
  lbl.textContent=colors[0]?colors[0].name||colors[0].hex:'';
  if(colors[0])postAll({type:'UPDATE_COLOR',value:colors[0].hex,opacity:colors[0].opacity??0.88,textColorOverride:colors[0].force_text_color?colors[0].text_color_override:null});
  wrap.querySelectorAll('.live-swatch').forEach(s=>{
    s.addEventListener('click',()=>{
      wrap.querySelectorAll('.live-swatch').forEach(x=>x.classList.remove('active'));
      s.classList.add('active');
      const c=colors[+s.dataset.i];
      lbl.textContent=c.name||c.hex;
      /* Toujours appliquer au slot actif uniquement */
      slotState[selectedSlot].color=c.hex;
      slotState[selectedSlot].opacity=c.opacity??0.88;
      postTo(selectedSlot,{type:'UPDATE_COLOR',value:c.hex,opacity:c.opacity??0.88,textColorOverride:c.force_text_color?c.text_color_override:null});
      document.getElementById('lbl-'+selectedSlot).textContent=c.name||c.hex;
    });
  });
}

// Sélection slot en mode comparaison
function selectSlot(slot){
  selectedSlot=slot;
  document.getElementById('slot-a').classList.toggle('primary',slot==='a');
  document.getElementById('slot-b').classList.toggle('primary',slot==='b');
  /* Recharger les zones et swatches pour ce slot */
  if(currentDesign){buildZones(currentDesign);buildSwatches(currentDesign);}
}
document.getElementById('slot-a').addEventListener('click',()=>{if(compareMode)selectSlot('a');});

// Comparaison
document.getElementById('btn-compare').addEventListener('click',()=>{
  compareMode=!compareMode;
  document.getElementById('btn-compare').classList.toggle('active',compareMode);
  const sb=document.getElementById('slot-b');
  const ia=document.getElementById('iframe-a');
  if(compareMode){
    sb.style.display='';
    ia.width=320;ia.height=320;
    // Ajouter listener slot-b
    document.getElementById('slot-b').addEventListener('click',()=>selectSlot('b'));
    if(currentDesign){
      const url=VIEWER_BASE+'?design='+encodeURIComponent(currentDesign.id)+'&v='+Date.now();
      document.getElementById('iframe-b').src=url;
      const colors=currentDesign.variant_colors||[];
      if(colors[1]){
        document.getElementById('lbl-b').textContent=colors[1].name||colors[1].hex;
        setTimeout(()=>postTo('b',{type:'UPDATE_COLOR',value:colors[1].hex,opacity:colors[1].opacity??0.88}),2200);
      }
    }
    selectSlot('a');
  }else{
    sb.style.display='none';
    ia.width=480;ia.height=480;
    document.getElementById('slot-a').classList.add('primary');
  }
});

// Rotation auto
document.getElementById('btn-autorot').addEventListener('click',()=>{
  autoRotating=!autoRotating;
  document.getElementById('btn-autorot').classList.toggle('active',autoRotating);
  postAll({type:'SET_AUTO_ROTATE',value:autoRotating,speed:0.003});
});

// Zoom double-clic
document.getElementById('viewers-wrap').addEventListener('dblclick',()=>{
  if(!currentDesign)return;
  document.getElementById('zoom-overlay').classList.add('open');
});
document.getElementById('zoom-close').addEventListener('click',()=>document.getElementById('zoom-overlay').classList.remove('open'));
document.getElementById('zoom-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('zoom-overlay'))document.getElementById('zoom-overlay').classList.remove('open');});

// Téléchargement PNG
window.addEventListener('message',e=>{
  if(!e.data)return;
  if(e.data.type==='SHARE_IMAGE_READY'){
    const btn=document.getElementById('btn-dl');btn.textContent='📥 Télécharger PNG';btn.disabled=false;
    let name=document.getElementById('png-name').value.trim()||'gobelet-kuztom';
    if(!name.endsWith('.png'))name+='.png';
    const a=document.createElement('a');a.href=e.data.dataUrl;a.download=name;a.click();
  }
  if(e.data.type==='SHARE_IMAGE_ERROR'){
    const btn=document.getElementById('btn-dl');btn.textContent='📥 Télécharger PNG';btn.disabled=false;
  }
});
document.getElementById('btn-dl').addEventListener('click',()=>{
  if(!currentDesign){alert('Sélectionnez un design');return;}
  const btn=document.getElementById('btn-dl');btn.textContent='⏳...';btn.disabled=true;
  postTo('a',{type:'REQUEST_SHARE_IMAGE'});
  setTimeout(()=>{btn.textContent='📥 Télécharger PNG';btn.disabled=false;},6000);
});

// Bibliothèque couleurs
function getColorLib(){
  try{
    const stored=localStorage.getItem(LIVE_LIB_KEY);
    if(stored)return JSON.parse(stored);
    /* Première fois : charger la palette par défaut */
    localStorage.setItem(LIVE_LIB_KEY,JSON.stringify(DEFAULT_COLORS));
    return DEFAULT_COLORS;
  }catch{return DEFAULT_COLORS;}
}
function renderColorLib(){
  const lib=getColorLib();
  const wrap=document.getElementById('color-lib');
  wrap.innerHTML=lib.map((c,i)=>`<div class="clib-dot" style="background:${c}" data-c="${c}" data-i="${i}" title="${c}"></div>`).join('')+'<div class="clib-add" id="clib-add">+</div>';
  wrap.querySelectorAll('.clib-dot').forEach(d=>{
    d.addEventListener('click',()=>postAll({type:'UPDATE_COLOR',value:d.dataset.c,opacity:0.88}));
    d.addEventListener('contextmenu',e=>{e.preventDefault();const l=getColorLib();l.splice(+d.dataset.i,1);localStorage.setItem(LIVE_LIB_KEY,JSON.stringify(l));renderColorLib();});
  });
  document.getElementById('clib-add').addEventListener('click',()=>{
    const h=prompt('Code couleur hex (#rrggbb)');
    if(h&&/^#[0-9a-fA-F]{6}$/.test(h)){const l=getColorLib();if(!l.includes(h))l.push(h);localStorage.setItem(LIVE_LIB_KEY,JSON.stringify(l));renderColorLib();}
  });
}

// Présets
function getPresets(){try{return JSON.parse(localStorage.getItem(PRESETS_KEY))||[];}catch{return[];}}
function renderPresets(){
  const presets=getPresets();
  const row=document.getElementById('presets-row');
  row.innerHTML=presets.map((p,i)=>`
    <div class="preset-chip" data-i="${i}">
      <span class="preset-name">${p.name}</span>
      <span class="del" data-del="${i}">✕</span>
    </div>
  `).join('');
  row.querySelectorAll('.preset-chip').forEach(chip=>{
    chip.addEventListener('click',e=>{
      if(e.target.classList.contains('del'))return;
      const p=getPresets()[+chip.dataset.i];if(!p)return;
      // Restaurer zones texte
      document.querySelectorAll('.live-ta').forEach(ta=>{
        const v=p.texts&&p.texts[ta.dataset.zid];
        if(v!==undefined){ta.value=v;postAll({type:'UPDATE_TEXT',zoneId:ta.dataset.zid,value:v});}
      });
      // Restaurer couleur
      if(p.color){
        postAll({type:'UPDATE_COLOR',value:p.color,opacity:p.opacity??0.88});
        const sw=document.querySelector(`.live-swatch[style*="${p.color}"]`);
        if(sw){document.querySelectorAll('.live-swatch').forEach(x=>x.classList.remove('active'));sw.classList.add('active');}
      }
    });
    const del=chip.querySelector('.del');
    if(del)del.addEventListener('click',()=>{const l=getPresets();l.splice(+del.dataset.del,1);localStorage.setItem(PRESETS_KEY,JSON.stringify(l));renderPresets();});
  });
}
document.getElementById('btn-save-preset').addEventListener('click',()=>{
  const name=prompt('Nom du préset (ex: Mariage Sophie & Lucas)');
  if(!name)return;
  const texts={};
  document.querySelectorAll('.live-ta').forEach(ta=>{texts[ta.dataset.zid]=ta.value;});
  const activeSwatch=document.querySelector('.live-swatch.active');
  const preset={name,texts,color:activeSwatch?activeSwatch.style.background:'',opacity:0.88};
  const l=getPresets();l.push(preset);localStorage.setItem(PRESETS_KEY,JSON.stringify(l));renderPresets();
});

// Changement mot de passe live
document.getElementById('btn-pwd').addEventListener('click',()=>{
  function hash(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*0x01000193)>>>0;}return h.toString(16).padStart(8,'0')+(h^0xdeadbeef).toString(16).padStart(8,'0');}
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:99998;display:flex;align-items:center;justify-content:center;font-family:Jost,sans-serif;';
  ov.innerHTML=`<div style="background:#151210;border:1px solid rgba(201,169,110,0.25);border-radius:20px;padding:40px;width:380px;text-align:center">
    <div style="color:#c9a96e;font-size:16px;font-weight:700;margin-bottom:24px">🔑 Changer le mot de passe</div>
    <input id="p1" type="password" placeholder="Mot de passe actuel" style="width:100%;padding:10px;background:rgba(201,169,110,0.05);border:1px solid rgba(201,169,110,0.2);border-radius:8px;color:#f0e8d8;font-size:13px;box-sizing:border-box;outline:none;margin-bottom:8px;font-family:Jost,sans-serif">
    <input id="p2" type="password" placeholder="Nouveau mot de passe" style="width:100%;padding:10px;background:rgba(201,169,110,0.05);border:1px solid rgba(201,169,110,0.2);border-radius:8px;color:#f0e8d8;font-size:13px;box-sizing:border-box;outline:none;margin-bottom:8px;font-family:Jost,sans-serif">
    <input id="p3" type="password" placeholder="Confirmer" style="width:100%;padding:10px;background:rgba(201,169,110,0.05);border:1px solid rgba(201,169,110,0.2);border-radius:8px;color:#f0e8d8;font-size:13px;box-sizing:border-box;outline:none;margin-bottom:14px;font-family:Jost,sans-serif">
    <div id="perr" style="font-size:12px;color:#e06c75;min-height:18px;margin-bottom:10px"></div>
    <div style="display:flex;gap:8px">
      <button id="pcan" style="flex:1;padding:10px;background:#1e1a14;border:none;border-radius:8px;color:#f0e8d8;cursor:pointer;font-family:Jost,sans-serif">Annuler</button>
      <button id="pok" style="flex:2;padding:10px;background:linear-gradient(135deg,#c9a96e,#e8d5a3);border:none;border-radius:8px;color:#0a0805;font-weight:700;cursor:pointer;font-family:Jost,sans-serif">Changer</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  document.getElementById('pcan').onclick=()=>document.body.removeChild(ov);
  document.getElementById('pok').onclick=()=>{
    const cur=document.getElementById('p1').value,nw=document.getElementById('p2').value,cf=document.getElementById('p3').value;
    const stored=localStorage.getItem(LIVE_HASH_KEY)||hash('kuztom-live');
    if(hash(cur)!==stored){document.getElementById('perr').textContent='❌ Mot de passe incorrect';return;}
    if(nw.length<6){document.getElementById('perr').textContent='❌ Minimum 6 caractères';return;}
    if(nw!==cf){document.getElementById('perr').textContent='❌ Mots de passe différents';return;}
    localStorage.setItem(LIVE_HASH_KEY,hash(nw));document.body.removeChild(ov);alert('✅ Mot de passe changé !');
  };
});

// Search
document.getElementById('gallery-search').addEventListener('input',e=>renderGallery(e.target.value));

// ── RESIZE VIEWER ────────────────────────────────────────────────
function resizeViewer(){
  const wrap = document.getElementById('viewers-wrap');
  if(!wrap) return;
  const h = wrap.offsetHeight - 32;
  const w = wrap.offsetWidth - 32;
  if(compareMode){
    /* Deux gobelets identiques côte à côte */
    const size = Math.min(h, Math.floor((w-20)/2), 380);
    ['a','b'].forEach(s=>{
      const ifr=document.getElementById('iframe-'+s);
      if(ifr){ifr.style.width=size+'px';ifr.style.height=size+'px';}
    });
  } else {
    const size = Math.min(h, w, 620);
    const ia = document.getElementById('iframe-a');
    if(ia){ ia.style.width=size+'px'; ia.style.height=size+'px'; }
  }
}
window.addEventListener('resize', resizeViewer);

// ── INIT ─────────────────────────────────────────────────────────
function initApp(){
  createBokeh();
  renderColorLib();
  renderPresets();
  fetch(DESIGNS_JSON+'?t='+Date.now())
    .then(r=>r.ok?r.json():Promise.reject())
    .then(data=>{
      designs=data.filter(d=>d.active!==false&&d.shopify_handle).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
      designs.forEach(d=>loadImg(d));
      renderGallery();
      if(designs.length>0)selectDesign(designs[0]);
      setTimeout(resizeViewer, 100);
    })
    .catch(()=>{document.getElementById('gallery-list').innerHTML='<div style="padding:16px;color:var(--muted);font-size:12px">Erreur chargement</div>';});
}
</script>
