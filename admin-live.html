<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuztom — Studio Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#100E0B; --s1:#181410; --s2:#201C17; --s3:#2A241E;
  --gold:#C9A96E; --gold-lt:#E8D5A3; --gold-dim:rgba(201,169,110,0.1);
  --text:#F0E8D8; --muted:rgba(240,232,216,0.42);
  --border:rgba(201,169,110,0.14); --border2:rgba(240,232,216,0.07);
  --danger:#E06C75;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Jost',sans-serif;font-size:13px;}
#lock{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 50% 35%,#1E180F,#060504);display:flex;align-items:center;justify-content:center;}
#lbox{background:rgba(14,11,7,0.96);border:1px solid rgba(201,169,110,0.2);border-radius:22px;padding:50px 42px;width:370px;text-align:center;box-shadow:0 0 80px rgba(201,169,110,0.04),0 40px 70px rgba(0,0,0,0.8);}
#lbrand{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;color:var(--gold);letter-spacing:6px;margin-bottom:4px;}
#lsub{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;}
#lline{width:34px;height:1px;background:var(--gold);opacity:0.35;margin:0 auto 28px;}
#linp{width:100%;padding:13px 16px;background:rgba(201,169,110,0.04);border:1px solid rgba(201,169,110,0.16);border-radius:10px;color:var(--text);font-size:14px;font-family:'Jost',sans-serif;text-align:center;letter-spacing:4px;outline:none;transition:border-color .3s;margin-bottom:11px;}
#linp:focus{border-color:var(--gold);}
#lbtn{width:100%;padding:12px;border:none;border-radius:10px;cursor:pointer;background:linear-gradient(135deg,#C9A96E,#E8D5A3,#C9A96E);background-size:200% 100%;background-position:100% 0;color:#0a0805;font-family:'Jost',sans-serif;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;transition:background-position .4s;}
#lbtn:hover{background-position:0 0;}
#lerr{font-size:12px;color:var(--danger);margin-top:10px;min-height:16px;}
#linf{font-size:10px;color:var(--muted);margin-top:6px;}
#app{display:none;height:100vh;flex-direction:column;}
#app.on{display:flex;}
#top{height:52px;flex-shrink:0;background:rgba(6,4,2,0.96);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:10px;z-index:100;}
#tbrand{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;color:var(--gold);letter-spacing:4px;margin-right:auto;}
.ltag{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);background:rgba(201,169,110,0.09);border:1px solid rgba(201,169,110,0.16);border-radius:16px;padding:2px 9px;}
.ldot{width:6px;height:6px;border-radius:50%;background:#E85D5D;box-shadow:0 0 7px #E85D5D;animation:pd 1.5s infinite;}
@keyframes pd{0%,100%{opacity:1;}50%{opacity:.3;}}
.tbtn{padding:4px 11px;background:rgba(201,169,110,0.06);border:1px solid var(--border);border-radius:16px;color:var(--muted);font-family:'Jost',sans-serif;font-size:11px;cursor:pointer;transition:all .2s;}
.tbtn:hover,.tbtn.on{color:var(--gold);border-color:rgba(201,169,110,0.4);background:var(--gold-dim);}
#lay{display:flex;flex:1;overflow:hidden;}
#gal{width:220px;flex-shrink:0;background:rgba(6,4,2,0.75);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
#ghdr{padding:12px 14px 8px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px;}
#ghdr-title{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);}
#gsrch{width:100%;padding:7px 10px;background:rgba(201,169,110,0.04);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Jost',sans-serif;font-size:12px;outline:none;}
#gsrch::placeholder{color:var(--muted);}
#gslot-ind{display:none;padding:6px 14px;background:rgba(201,169,110,0.08);border-bottom:1px solid var(--border);font-size:10px;color:var(--gold);text-align:center;letter-spacing:1px;}
#glist{flex:1;overflow-y:auto;padding:4px;}
#glist::-webkit-scrollbar{width:2px;}
#glist::-webkit-scrollbar-thumb{background:var(--border);}
.gitem{padding:9px 12px;border-radius:8px;cursor:pointer;transition:all .18s;border:1px solid transparent;font-size:12px;font-weight:500;line-height:1.3;color:var(--text);}
.gitem:hover{background:var(--gold-dim);border-color:var(--border);}
.gitem.active-a{background:rgba(201,169,110,0.12);border-color:rgba(201,169,110,0.4);}
.gitem.active-b{background:rgba(100,140,220,0.1);border-color:rgba(100,140,220,0.35);}
.gitem-vierge{border:1px dashed rgba(201,169,110,0.3);color:var(--gold);font-style:italic;}
.gitem-vierge:hover{background:rgba(201,169,110,0.08);border-color:rgba(201,169,110,0.5);}
#ctr{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#vwrap{flex:1;display:flex;align-items:center;justify-content:center;gap:16px;padding:16px;position:relative;overflow:hidden;transition:background .7s;}
#vwrap[data-bg="mariage"]{background:radial-gradient(ellipse 70% 55% at 50% 55%,rgba(220,185,130,0.08) 0%,transparent 70%),#0E0B07;}
#vwrap[data-bg="bapteme"]{background:radial-gradient(ellipse 70% 55% at 50% 55%,rgba(150,185,230,0.09) 0%,transparent 70%),#080B12;}
#vwrap[data-bg="anniversaire"]{background:radial-gradient(ellipse 70% 55% at 50% 55%,rgba(225,130,175,0.09) 0%,transparent 70%),#12080E;}
#vwrap[data-bg="babyshower"]{background:radial-gradient(ellipse 50% 55% at 30% 55%,rgba(190,230,200,0.08) 0%,transparent 50%),radial-gradient(ellipse 50% 55% at 70% 55%,rgba(230,175,195,0.08) 0%,transparent 50%),#090E0A;}
#vwrap[data-bg="annimariage"]{background:radial-gradient(ellipse 70% 55% at 50% 55%,rgba(190,80,80,0.09) 0%,transparent 70%),#130707;}
#vwrap[data-bg="gender"]{background:radial-gradient(ellipse 55% 55% at 28% 55%,rgba(220,130,180,0.08) 0%,transparent 50%),radial-gradient(ellipse 55% 55% at 72% 55%,rgba(130,165,230,0.08) 0%,transparent 50%),#090810;}
.vslot{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;min-width:0;}
.vframe{border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.85),0 0 0 1px rgba(201,169,110,0.1);transition:box-shadow .3s;width:100%;aspect-ratio:1;position:relative;}
.vslot.sel .vframe{box-shadow:0 24px 70px rgba(0,0,0,0.9),0 0 0 2px rgba(201,169,110,0.5);}
.vframe iframe{display:block;width:100%;height:100%;border:none;}
.vslot .edit-btn{display:none;margin-top:4px;padding:3px 12px;background:rgba(201,169,110,0.1);border:1px solid rgba(201,169,110,0.3);border-radius:14px;color:rgba(201,169,110,0.7);font-family:'Jost',sans-serif;font-size:10px;cursor:pointer;transition:all .2s;letter-spacing:1px;text-transform:uppercase;}
.vslot .edit-btn:hover{background:rgba(201,169,110,0.2);color:var(--gold);}
.vslot.sel .edit-btn{color:var(--gold);background:var(--gold-dim);border-color:var(--gold);}
.compare-mode .vslot .edit-btn{display:block;}
.vslot-lbl{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
#hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(201,169,110,0.3);pointer-events:none;animation:hp 3s ease-in-out infinite;}
@keyframes hp{0%,100%{opacity:.3;}50%{opacity:.7;}}
#bgbar{padding:8px 16px;border-top:1px solid var(--border);background:rgba(6,4,2,0.85);display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
#bglbl{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-right:3px;}
.bgbtn{padding:4px 11px;border-radius:16px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-family:'Jost',sans-serif;font-size:11px;cursor:pointer;transition:all .2s;white-space:nowrap;}
.bgbtn:hover{color:var(--text);border-color:var(--border);}
.bgbtn.on{background:var(--gold-dim);border-color:var(--gold);color:var(--gold);}
#rgt{width:268px;flex-shrink:0;background:rgba(6,4,2,0.8);border-left:1px solid var(--border);display:flex;flex-direction:column;}
#rscr{flex:1;overflow-y:auto;padding:16px 13px;}
#rscr::-webkit-scrollbar{width:2px;}
#rscr::-webkit-scrollbar-thumb{background:var(--border);}
.rs{margin-bottom:20px;}
.rt{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:9px;display:flex;align-items:center;gap:7px;}
.rt::after{content:'';flex:1;height:1px;background:var(--border2);}
.zgroup{margin-bottom:12px;}
.zlbl{font-size:11px;color:var(--muted);margin-bottom:3px;}
.zinprow{display:flex;gap:5px;align-items:flex-start;}
.lta{flex:1;padding:8px 10px;background:rgba(201,169,110,0.04);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'Jost',sans-serif;font-size:13px;outline:none;resize:none;overflow:hidden;line-height:1.45;cursor:text;transition:border-color .2s;}
.lta:focus{border-color:rgba(201,169,110,0.4);}
.photo-upload-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border:1.5px dashed rgba(201,169,110,0.4);border-radius:8px;cursor:pointer;font-size:12px;color:var(--muted);background:rgba(201,169,110,0.04);transition:border-color .2s;width:fit-content;margin-top:4px;}
.photo-upload-btn:hover{border-color:var(--gold);}
.photo-file-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
.crop-controls{margin-top:8px;padding:10px 12px;background:rgba(201,169,110,0.04);border:1px solid var(--border);border-radius:8px;}
.crop-row{display:flex;align-items:center;gap:5px;margin-bottom:6px;flex-wrap:wrap;}
.crop-lbl{font-size:10px;color:var(--muted);min-width:55px;letter-spacing:1px;text-transform:uppercase;}
.crop-btn{width:32px;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--bg);cursor:pointer;font-size:15px;color:var(--text);display:flex;align-items:center;justify-content:center;padding:0;}
.crop-btn:hover{border-color:var(--gold);}
.crop-slider{flex:1;min-width:60px;accent-color:var(--gold);}
.crop-reset{font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;margin-top:2px;}
.crop-reset:hover{color:var(--gold);}
.zcpick{width:20px;height:20px;padding:0;border:none;border-radius:50%;cursor:pointer;flex-shrink:0;margin-top:4px;box-shadow:0 0 0 1.5px rgba(255,255,255,0.2);overflow:hidden;appearance:none;-webkit-appearance:none;background:none;}
.swrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:5px;}
.sw{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s;box-shadow:0 1px 6px rgba(0,0,0,0.5);}
.sw:hover{transform:scale(1.15);}
.sw.on{border-color:#fff;box-shadow:0 1px 8px rgba(0,0,0,0.7),0 0 0 2px rgba(201,169,110,0.35);}
.sw.dk{box-shadow:0 0 0 1.5px rgba(255,255,255,0.25),0 1px 6px rgba(0,0,0,0.5);}
.clibrow{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;}
.cdot{width:19px;height:19px;border-radius:50%;cursor:pointer;border:1px solid rgba(255,255,255,0.07);transition:transform .15s;box-shadow:0 1px 4px rgba(0,0,0,0.4);}
.cdot:hover{transform:scale(1.22);}
.cadd{width:19px;height:19px;border-radius:50%;background:var(--s3);border:1px dashed var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);transition:all .2s;}
.cadd:hover{color:var(--gold);border-color:var(--gold);}
.prow{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;}
.pchip{padding:3px 9px;background:var(--s2);border:1px solid var(--border2);border-radius:14px;font-size:11px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .2s;}
.pchip:hover{border-color:var(--gold);color:var(--gold);}
.pdel{color:var(--danger);font-size:9px;opacity:.7;}
.sbtn{width:100%;padding:7px;background:transparent;border:1px dashed var(--border);border-radius:7px;color:var(--muted);font-family:'Jost',sans-serif;font-size:11px;cursor:pointer;transition:all .2s;}
.sbtn:hover{border-color:var(--gold);color:var(--gold);}
/* Bouton upload PNG client */
#vierge-upload-wrap{margin-bottom:16px;}
#vierge-upload-wrap .rt{margin-bottom:9px;}
.vierge-upload-zone{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 12px;border:2px dashed rgba(201,169,110,0.35);border-radius:12px;background:rgba(201,169,110,0.04);cursor:pointer;transition:all .2s;text-align:center;}
.vierge-upload-zone:hover{border-color:var(--gold);background:rgba(201,169,110,0.08);}
.vierge-upload-zone svg{opacity:.5;}
.vierge-upload-zone:hover svg{opacity:1;}
.vierge-upload-zone span{font-size:12px;color:var(--muted);line-height:1.5;}
.vierge-upload-zone:hover span{color:var(--gold);}
.vierge-file-name{font-size:11px;color:var(--gold);text-align:center;padding:4px 0;display:none;}
#rbot{padding:13px;border-top:1px solid var(--border);background:rgba(6,4,2,0.9);}
#pname{width:100%;padding:8px 10px;background:rgba(201,169,110,0.04);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'Jost',sans-serif;font-size:12px;outline:none;margin-bottom:8px;transition:border-color .2s;}
#pname:focus{border-color:rgba(201,169,110,0.4);}
#dlbtn{width:100%;padding:10px;border:none;border-radius:9px;cursor:pointer;background:linear-gradient(135deg,#C9A96E,#E8D5A3,#C9A96E);background-size:200% 100%;background-position:100% 0;color:#0a0805;font-family:'Jost',sans-serif;font-size:13px;font-weight:700;transition:all .3s;}
#dlbtn:hover{background-position:0 0;transform:translateY(-1px);box-shadow:0 8px 22px rgba(201,169,110,0.2);}
#zoom{display:none;position:fixed;inset:0;z-index:9000;background:rgba(4,3,2,0.96);align-items:center;justify-content:center;cursor:zoom-out;}
#zoom.on{display:flex;}
#zcl{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;background:rgba(201,169,110,0.09);border:1px solid var(--border);color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<div id="lock">
  <div id="lbox">
    <div id="lbrand">KUZTOM</div>
    <div id="lsub">Studio Live</div>
    <div id="lline"></div>
    <input type="password" id="linp" placeholder="••••••••" autocomplete="off">
    <button id="lbtn">Accéder</button>
    <div id="lerr"></div>
    <div id="linf"></div>
  </div>
</div>
<div id="app">
  <div id="top">
    <div id="tbrand">KUZTOM</div>
    <span class="ltag">Studio Live</span>
    <div class="ldot"></div>
    <button class="tbtn" id="btnComp">⊞ Comparaison</button>
    <button class="tbtn" id="btnAuto">↻ Rotation</button>
    <button class="tbtn" id="btnPwd">🔑 Mot de passe</button>
  </div>
  <div id="lay">
    <div id="gal">
      <div id="ghdr">
        <div id="ghdr-title">Designs disponibles</div>
        <input type="text" id="gsrch" placeholder="Rechercher...">
      </div>
      <div id="gslot-ind">→ Chargement dans : Gobelet A</div>
      <div id="glist"></div>
    </div>
    <div id="ctr">
      <div id="vwrap" data-bg="mariage">
        <div class="vslot sel" id="slotA">
          <div class="vframe" id="frameA"><iframe id="ifrA" src="" scrolling="no"></iframe></div>
          <button class="edit-btn" id="capA">✎ Éditer ce gobelet</button>
          <div class="vslot-lbl" id="lblA"></div>
        </div>
        <div class="vslot" id="slotB" style="display:none">
          <div class="vframe" id="frameB"><iframe id="ifrB" src="" scrolling="no"></iframe></div>
          <button class="edit-btn" id="capB">✎ Éditer ce gobelet</button>
          <div class="vslot-lbl" id="lblB"></div>
        </div>
        <div id="hint">↻ Glissez pour explorer &nbsp;·&nbsp; Double-clic pour zoomer</div>
      </div>
      <div id="bgbar">
        <span id="bglbl">Ambiance</span>
        <button class="bgbtn on" data-bg="mariage">💍 Mariage</button>
        <button class="bgbtn" data-bg="bapteme">🕊️ Baptême</button>
        <button class="bgbtn" data-bg="anniversaire">🎂 Anniversaire</button>
        <button class="bgbtn" data-bg="babyshower">👶 Baby Shower</button>
        <button class="bgbtn" data-bg="annimariage">💑 Anniv. Mariage</button>
        <button class="bgbtn" data-bg="gender">🎀 Gender Reveal</button>
      </div>
    </div>
    <div id="rgt">
      <div id="rscr">
        <div class="rs" id="zonesWrap">
          <div class="rt">Personnalisation</div>
          <div style="color:var(--muted);font-size:12px;font-style:italic;">Sélectionnez un design</div>
        </div>
        <div class="rs" id="swWrap" style="display:none">
          <div class="rt">Couleur gobelet</div>
          <div class="swrow" id="swRow"></div>
        </div>
        <div class="rs">
          <div class="rt">Couleurs texte rapides</div>
          <div class="clibrow" id="clib"></div>
        </div>
        <div class="rs">
          <div class="rt">Présets</div>
          <div class="prow" id="prow"></div>
          <button class="sbtn" id="btnSaveP">+ Sauvegarder cette configuration</button>
        </div>
      </div>
      <div id="rbot">
        <input type="text" id="pname" placeholder="Nom du fichier PNG...">
        <button id="dlbtn">📥 Télécharger PNG</button>
      </div>
    </div>
  </div>
</div>
<div id="zoom">
  <div id="zcl">✕</div>
  <iframe id="ifrZ" src="" width="700" height="700" style="border:none;border-radius:14px;display:block;"></iframe>
</div>
<!-- Input file caché pour PNG client (gobelet vierge) -->
<input type="file" id="vierge-file-input-a" accept="image/png,image/jpeg,image/webp" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;" data-slot="a">
<input type="file" id="vierge-file-input-b" accept="image/png,image/jpeg,image/webp" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;" data-slot="b">
<script>
const VB='https://clcreation542-coder.github.io/Code-3D/configurateur-viewer.html';
const VO='https://clcreation542-coder.github.io';
const LHKEY='kuztom_live_lock_until',LAKEY='kuztom_live_attempts',LHASHKEY='kuztom_live_ph';
const LIBKEY='kuztom_live_colors',PRESKEY='kuztom_live_presets';
const TEXTCOLORS=['#2c2521','#7a5c2e','#C9A96E','#ffffff','#000000','#8B0000','#1a3a6a','#2d5a2d','#6a1a6a','#8B4513','#D4175A','#FF7A00','#4A90D9','#50C878','#9B59B6','#E74C3C','#F39C12','#1ABC9C','#34495E','#E8C5A0'];

// Design gobelet vierge (pseudo-design interne, pas dans designs.json)
const DESIGN_VIERGE = {
  id: '__vierge__',
  name: 'Gobelet Vierge',
  _isVierge: true,
  text_zones: [], photo_zones: [], arch_zones: [], variant_colors: [],
  design_url: null
};

// PNG client uploadé par slot
const viergeDataUrl = { a: null, b: null };

(function(){
  function h(s){let v=0x811c9dc5;for(let i=0;i<s.length;i++){v^=s.charCodeAt(i);v=(v*0x01000193)>>>0;}return v.toString(16).padStart(8,'0')+(v^0xdeadbeef).toString(16).padStart(8,'0');}
  const DEF=h('kuztom-live');
  const el=id=>document.getElementById(id);
  function gH(){return localStorage.getItem(LHASHKEY)||DEF;}
  function gA(){return parseInt(localStorage.getItem(LAKEY)||'0');}
  function gL(){return parseInt(localStorage.getItem(LHKEY)||'0');}
  function tick(){
    const u=gL();
    if(u>Date.now()){const s=Math.ceil((u-Date.now())/1000);el('linf').textContent='⏳ Bloqué — '+s+'s';el('lbtn').disabled=true;el('linp').disabled=true;setTimeout(tick,1000);}
    else{el('lbtn').disabled=false;el('linp').disabled=false;const a=gA();el('linf').textContent=a>0?a+' tentative(s) échouée(s)':'';}
  }
  function tryL(){
    if(gL()>Date.now())return;if(!el('linp').value)return;
    if(h(el('linp').value)===gH()){

let designs=[],compareMode=false,autoRot=false,activeSlot='a';
const slotDesign={a:null,b:null};
var liveCropState={};
const slotZoneColors={a:{},b:{}};

function sendLiveCrop(slot,zoneId){
  if(!liveCropState[slot])liveCropState[slot]={};
  var c=liveCropState[slot][zoneId]||{zoom:1,offsetX:0,offsetY:0};
  postTo(slot,{type:'PHOTO_CROP',zoneId:zoneId,zoom:c.zoom,offsetX:c.offsetX,offsetY:c.offsetY});
  var slider=document.querySelector('.crop-slider[data-zid="'+zoneId+'"][data-slot="'+slot+'"]');
  if(slider)slider.value=Math.round(c.zoom*100);
}

function postTo(slot,data){
  const ifr=document.getElementById('ifr'+slot.toUpperCase());
  if(ifr&&ifr.contentWindow)ifr.contentWindow.postMessage(data,VO);
}

function renderGallery(q=''){
  const list=document.getElementById('glist');
  const items=designs.filter(d=>!q||d.name.toLowerCase().includes(q.toLowerCase()));

  // Gobelet Vierge toujours en haut
  const isViergeA = slotDesign.a && slotDesign.a._isVierge;
  const isViergeB = slotDesign.b && slotDesign.b._isVierge;
  let html = `<div class="gitem gitem-vierge${isViergeA?' active-a':isViergeB?' active-b':''}" data-id="__vierge__">🖼️ Gobelet Vierge</div>`;

  html += items.map(d=>{
    const isA=slotDesign.a&&slotDesign.a.id===d.id;
    const isB=slotDesign.b&&slotDesign.b.id===d.id;
    return `<div class="gitem${isA?' active-a':isB?' active-b':''}" data-id="${d.id}">${d.name}</div>`;
  }).join('');

  list.innerHTML = html;
  list.querySelectorAll('.gitem').forEach(item=>{
    item.addEventListener('click',()=>{
      if(item.dataset.id === '__vierge__'){
        loadDesignInSlot(activeSlot, DESIGN_VIERGE);
      } else {
        const d=designs.find(x=>x.id===item.dataset.id);
        if(d)loadDesignInSlot(activeSlot,d);
      }
    });
  });
}
document.getElementById('gsrch').addEventListener('input',e=>renderGallery(e.target.value));

function loadDesignInSlot(slot,d){
  slotDesign[slot]=d;
  if(d._isVierge){
    // Gobelet vierge : charger le viewer sans design, envoyer le PNG client si déjà uploadé
    const url=VB+'?v='+Date.now();
    const ifr=document.getElementById('ifr'+slot.toUpperCase());
    if(ifr){
      ifr.src=url;
      // Quand le viewer sera prêt, on envoie le PNG client si déjà chargé
      ifr.onload = function(){
        if(viergeDataUrl[slot]){
          setTimeout(()=>postTo(slot,{type:'SET_DESIGN_IMAGE',dataUrl:viergeDataUrl[slot]}),800);
        }
      };
    }
    if(slot==='a'){const iz=document.getElementById('ifrZ');if(iz)iz.src=url;}
  } else {
    const url=VB+'?design='+encodeURIComponent(d.id)+'&v='+Date.now();
    const ifr=document.getElementById('ifr'+slot.toUpperCase());
    if(ifr){ifr.onload=null;ifr.src=url;}
    if(slot==='a'){const iz=document.getElementById('ifrZ');if(iz)iz.src=url;}
  }
  renderGallery(document.getElementById('gsrch').value);
  if(slot===activeSlot)document.getElementById('pname').value=(d._isVierge?'gobelet-vierge':d.name)+'.png';
  buildControls(slot,d);
}

function buildControls(slot,d){
  if(slot!==activeSlot)return;
  buildZones(slot,d);
  buildSwatches(slot,d);
}

// ── Gestion upload PNG client pour gobelet vierge ──
function setupViergeUpload(slot){
  const input = document.getElementById('vierge-file-input-'+slot);
  if(!input)return;
  input.value=''; // reset
  input.onchange = function(){
    const file = input.files&&input.files[0]; if(!file)return;
    const reader = new FileReader();
    reader.onload = function(ev){
      viergeDataUrl[slot] = ev.target.result;
      // Envoyer au viewer via postMessage SET_DESIGN_IMAGE
      postTo(slot,{type:'SET_DESIGN_IMAGE',dataUrl:ev.target.result});
      // Mettre à jour le nom affiché
      const nameEl = document.getElementById('vierge-fname-'+slot);
      if(nameEl){nameEl.textContent='✅ '+file.name;nameEl.style.display='block';}
      document.getElementById('pname').value = file.name.replace(/\.[^.]+$/,'')+'-rendu.png';
    };
    reader.readAsDataURL(file);
  };
}

function buildZones(slot,d){
  const wrap=document.getElementById('zonesWrap');

  // ── CAS SPÉCIAL : Gobelet Vierge ──
  if(d._isVierge){
    wrap.innerHTML=`
      <div class="rt">PNG client</div>
      <div id="vierge-upload-wrap">
        <label class="vierge-upload-zone" for="vierge-file-input-${slot}">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/><polyline points="8 12 12 8 16 12"/><line x1="12" y1="8" x2="12" y2="16"/>
          </svg>
          <span>Uploader le PNG du client<br><span style="font-size:10px;opacity:0.6;">PNG · JPEG · WebP — idéalement 1970×1140</span></span>
        </label>
        <div class="vierge-file-name" id="vierge-fname-${slot}"></div>
      </div>`;
    setupViergeUpload(slot);
    document.getElementById('swWrap').style.display='none';
    return;
  }

  const zones=(d.text_zones||[]).slice().sort((a,b)=>(a.ordre||a.order||99)-(b.ordre||b.order||99));
  const photoZonesCheck=d.photo_zones||[];
  if(!zones.length&&!photoZonesCheck.length){wrap.innerHTML='<div class="rt">Personnalisation</div><div style="color:var(--muted);font-size:12px;font-style:italic;">Aucune zone</div>';return;}
  if(!zones.length){wrap.innerHTML='<div class="rt">Personnalisation</div>';}
  else{
    wrap.innerHTML='<div class="rt">Personnalisation</div>'+zones.map(z=>{
      const col=slotZoneColors[slot][z.id]||z.color||'#7a5c2e';
      const ph=(z.placeholder||'').replace(/"/g,'&quot;');
      return `<div class="zgroup"><div class="zlbl" style="display:flex;align-items:center;justify-content:space-between;">${z.label||z.id}<span class="fs-indicator" data-zid="${z.id}" style="font-size:10px;color:var(--gold);background:rgba(201,169,110,0.1);border:1px solid rgba(201,169,110,0.2);border-radius:10px;padding:1px 7px;font-family:monospace;">—</span></div><div class="zinprow"><textarea class="lta" rows="2" data-zid="${z.id}" data-slot="${slot}">${ph}</textarea><input type="color" class="zcpick" data-zid="${z.id}" data-slot="${slot}" value="${col}"></div></div>`;
    }).join('');
  }
  const _fsCanvas=document.createElement('canvas');
  const _fsCtx=_fsCanvas.getContext('2d');
  function calcFontSize(zone,text){
    let fs=zone.font_size||48;
    const lh=zone.lineHeight||1.3;
    const lines=(text||'').split('\n');
    if(!lines.some(l=>l.trim()))return fs;
    while(fs>6){
      _fsCtx.font=`${fs}px '${zone.font_family||'Jost'}'`;
      const maxW=Math.max(...lines.map(l=>_fsCtx.measureText(l).width));
      const m=_fsCtx.measureText('Agyjpq');
      const realH=(m.actualBoundingBoxAscent+m.actualBoundingBoxDescent)||fs*0.8;
      const totalH=lines.length*realH+(lines.length-1)*(fs*(lh-1));
      if(maxW<=zone.width&&totalH<=zone.height)break;
      fs-=1;
    }
    return fs;
  }
  function updateFsIndicator(zid,zone,text){
    const el=document.querySelector(`.fs-indicator[data-zid="${zid}"]`);
    if(!el)return;
    const fs=calcFontSize(zone,text);
    el.textContent=fs+'px';
    el.style.color=fs<20?'#e06c75':fs<40?'#e8a020':'var(--gold)';
  }
  wrap.querySelectorAll('.lta').forEach(ta=>{
    const zone=zones.find(z=>z.id===ta.dataset.zid);
    postTo(ta.dataset.slot,{type:'UPDATE_TEXT',zoneId:ta.dataset.zid,value:ta.value});
    if(zone)updateFsIndicator(ta.dataset.zid,zone,ta.value);
    ta.addEventListener('input',()=>{
      postTo(ta.dataset.slot,{type:'UPDATE_TEXT',zoneId:ta.dataset.zid,value:ta.value});
      if(zone)updateFsIndicator(ta.dataset.zid,zone,ta.value);
    });
  });
  wrap.querySelectorAll('.zcpick').forEach(cp=>{
    function sendColor(){slotZoneColors[cp.dataset.slot][cp.dataset.zid]=cp.value;postTo(cp.dataset.slot,{type:'UPDATE_ZONE_COLOR',zoneId:cp.dataset.zid,color:cp.value});}
    cp.addEventListener('input',sendColor);cp.addEventListener('change',sendColor);
  });
  var photoZones=d.photo_zones||[];
  if(photoZones.length>0){
    var photoHtml='<div class="rt" style="margin-top:12px;">Photo</div>';
    photoZones.forEach(function(pz){
      var uid='live-ph-'+slot+'-'+pz.id;
      photoHtml+='<div class="zgroup"><div class="zlbl">'+(pz.label||'Photo')+'</div><label class="photo-upload-btn" for="'+uid+'"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="16 16 12 12 8 16"></polyline><line x1="12" y1="12" x2="12" y2="21"></line><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path></svg><span class="live-ph-name-'+pz.id+'">Choisir une photo</span><input type="file" id="'+uid+'" class="photo-file-input" accept="image/*" data-zid="'+pz.id+'" data-slot="'+slot+'"></label><div class="crop-controls" id="crop-'+slot+'-'+pz.id+'" style="display:none;"><div class="crop-row"><span class="crop-lbl">Zoom</span><button type="button" class="crop-btn" data-action="zm" data-zid="'+pz.id+'" data-slot="'+slot+'">−</button><input type="range" class="crop-slider" data-zid="'+pz.id+'" data-slot="'+slot+'" min="50" max="300" value="100" step="5"><button type="button" class="crop-btn" data-action="zp" data-zid="'+pz.id+'" data-slot="'+slot+'">+</button></div><div class="crop-row"><span class="crop-lbl">Position</span><button type="button" class="crop-btn" data-action="l" data-zid="'+pz.id+'" data-slot="'+slot+'">◀</button><button type="button" class="crop-btn" data-action="r" data-zid="'+pz.id+'" data-slot="'+slot+'">▶</button><button type="button" class="crop-btn" data-action="u" data-zid="'+pz.id+'" data-slot="'+slot+'">▲</button><button type="button" class="crop-btn" data-action="d" data-zid="'+pz.id+'" data-slot="'+slot+'">▼</button></div><button type="button" class="crop-reset" data-zid="'+pz.id+'" data-slot="'+slot+'">↺ Réinitialiser</button></div></div>';
    });
    wrap.innerHTML+=photoHtml;
    wrap.querySelectorAll('.photo-file-input').forEach(function(input){
      input.addEventListener('change',function(){
        var file=input.files&&input.files[0];if(!file)return;
        var zid=input.dataset.zid;var sl=input.dataset.slot;
        var reader=new FileReader();
        reader.onload=function(ev){
          if(!liveCropState[sl])liveCropState[sl]={};
          liveCropState[sl][zid]={zoom:1,offsetX:0,offsetY:0};
          postTo(sl,{type:'UPDATE_PHOTO',zoneId:zid,value:ev.target.result});
          var nameEl=wrap.querySelector('.live-ph-name-'+zid);if(nameEl)nameEl.textContent=file.name;
          var cropEl=document.getElementById('crop-'+sl+'-'+zid);if(cropEl)cropEl.style.display='block';
        };
        reader.readAsDataURL(file);
      });
    });
    wrap.querySelectorAll('.crop-slider').forEach(function(slider){
      slider.addEventListener('input',function(){
        var zid=slider.dataset.zid;var sl=slider.dataset.slot;
        if(!liveCropState[sl])liveCropState[sl]={};
        if(!liveCropState[sl][zid])liveCropState[sl][zid]={zoom:1,offsetX:0,offsetY:0};
        liveCropState[sl][zid].zoom=parseInt(slider.value)/100;sendLiveCrop(sl,zid);
      });
    });
    wrap.querySelectorAll('.crop-btn').forEach(function(btn){
      btn.addEventListener('click',function(){
        var zid=btn.dataset.zid;var sl=btn.dataset.slot;var action=btn.dataset.action;
        if(!liveCropState[sl])liveCropState[sl]={};
        if(!liveCropState[sl][zid])liveCropState[sl][zid]={zoom:1,offsetX:0,offsetY:0};
        var c=liveCropState[sl][zid];var STEP=20;
        if(action==='zm'){c.zoom=Math.max(0.5,c.zoom-0.1);}
        if(action==='zp'){c.zoom=Math.min(3,c.zoom+0.1);}
        if(action==='l'){c.offsetX-=STEP;}if(action==='r'){c.offsetX+=STEP;}
        if(action==='u'){c.offsetY-=STEP;}if(action==='d'){c.offsetY+=STEP;}
        sendLiveCrop(sl,zid);
      });
    });
    wrap.querySelectorAll('.crop-reset').forEach(function(btn){
      btn.addEventListener('click',function(){
        var zid=btn.dataset.zid;var sl=btn.dataset.slot;
        if(!liveCropState[sl])liveCropState[sl]={};
        liveCropState[sl][zid]={zoom:1,offsetX:0,offsetY:0};
        postTo(sl,{type:'PHOTO_CROP_RESET',zoneId:zid});
        var slider=wrap.querySelector('.crop-slider[data-zid="'+zid+'"][data-slot="'+sl+'"]');
        if(slider)slider.value=100;
      });
    });
  }
}

function buildSwatches(slot,d){
  const sec=document.getElementById('swWrap');
  if(d._isVierge){sec.style.display='none';return;}
  const colors=d.variant_colors||[];
  if(!colors.length){sec.style.display='none';return;}
  sec.style.display='';
  const row=document.getElementById('swRow');
  row.innerHTML=colors.map((c,i)=>{
    const isDark=c.hex&&[c.hex.slice(1,3),c.hex.slice(3,5),c.hex.slice(5,7)].every(p=>parseInt(p,16)<70);
    return `<div class="sw${i===0?' on':''}${isDark?' dk':''}" data-i="${i}" data-slot="${slot}" style="background:${c.hex}" title="${c.name||c.hex}"></div>`;
  }).join('');
  if(colors[0])postTo(slot,{type:'UPDATE_COLOR',value:colors[0].hex,opacity:colors[0].opacity??0.88,textColorOverride:colors[0].force_text_color?colors[0].text_color_override:null});
  row.querySelectorAll('.sw').forEach(s=>{
    s.addEventListener('click',()=>{
      row.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));s.classList.add('on');
      const c=colors[+s.dataset.i];
      postTo(s.dataset.slot,{type:'UPDATE_COLOR',value:c.hex,opacity:c.opacity??0.88,textColorOverride:c.force_text_color?c.text_color_override:null});
    });
  });
}

function resizeViewers(){
  const wrap=document.getElementById('vwrap');
  const h=wrap.offsetHeight-32,w=wrap.offsetWidth-32;
  if(compareMode){
    const sz=Math.min(Math.floor(h*0.92),Math.floor((w-12)/2));
    ['A','B'].forEach(s=>{
      const fr=document.getElementById('frame'+s),ifr=document.getElementById('ifr'+s);
      if(fr){fr.style.width=sz+'px';fr.style.height=sz+'px';fr.style.minWidth='0';fr.style.maxWidth=sz+'px';}
      if(ifr){ifr.style.width=sz+'px';ifr.style.height=sz+'px';}
    });
  }else{
    const sz=Math.min(h,w,600);
    const frA=document.getElementById('frameA'),ifrA=document.getElementById('ifrA');
    if(frA){frA.style.width=sz+'px';frA.style.height=sz+'px';}

      <label style="display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;background:rgba(201,169,110,0.06);border:1px solid rgba(201,169,110,0.15)"><input type="radio" name="dlslot" value="b" style="accent-color:#C9A96E;"> <span style="color:#F0E8D8;font-size:12px;">${slotBName}</span></label>

    <div style="text-align:left;margin-bottom:16px"><div style="font-size:10px;color:rgba(240,232,216,0.4);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;">Nom du fichier</div>
      <div style="display:flex;align-items:center;gap:6px"><input id="dl-name-inp" type="text" value="${defName}" style="flex:1;padding:9px 11px;background:rgba(201,169,110,0.06);border:1px solid rgba(201,169,110,0.2);border-radius:8px;color:#F0E8D8;font-size:13px;font-family:Jost,sans-serif;outline:none;"><span style="color:rgba(240,232,216,0.4);font-size:12px;">.png</span></div></div>

async function generatePNGImprimeur(slot, fileName) {
  const d = slotDesign[slot];
  if (!d) { alert('Aucun design dans ce slot'); return; }
  const W=1970, H=1140;
  const canvas = document.createElement('canvas');
  canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d', {alpha:true});
  ctx.clearRect(0,0,W,H);

  // ── CAS GOBELET VIERGE : afficher directement le PNG client ──
  if(d._isVierge){
    const dataUrl = viergeDataUrl[slot];
    if(!dataUrl){ alert('Aucun PNG client uploadé pour ce slot.'); return; }
    await new Promise(resolve => {
      const img = new Image();
      img.onload = () => { ctx.drawImage(img, 0, 0, W, H); resolve(); };
      img.onerror = resolve;
      img.src = dataUrl;
    });
    const fn=(fileName||'gobelet-vierge').replace(/[^a-zA-Z0-9-_ ]/g,'').trim()+'-rendu.png';
    return new Promise(resolve => {
      canvas.toBlob(blob => {
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');a.href=url;a.download=fn;a.click();
        setTimeout(()=>URL.revokeObjectURL(url),2000);
        resolve();
      },'image/png');
    });
  }

  if (d.design_url) {
    await new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const di = d.design||{x:0,y:0,width:W,height:H};
        ctx.drawImage(img, di.x||0, di.y||0, W, H);
        resolve();
      };
      img.onerror = () => {
        const img2 = new Image();
        img2.crossOrigin = 'anonymous';
        img2.onload = () => { ctx.drawImage(img2, 0, 0, W, H); resolve(); };
        img2.onerror = resolve;
        img2.src = d.design_url;
      };
      img.src = d.design_url + (d.design_url.includes('?')?'&':'?') + 't=' + Date.now();
    });
  }

  const photoZones = d.photo_zones || [];
  for (const pz of photoZones) {
    const fileInput = document.querySelector('.photo-file-input[data-zid="' + pz.id + '"][data-slot="' + slot + '"]');
    if (!fileInput || !fileInput.files || !fileInput.files[0]) continue;
    await new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const zx=pz.x, zy=pz.y, zw=pz.width, zh=pz.height;
          const iw=img.naturalWidth||img.width||1, ih=img.naturalHeight||img.height||1;
          const crop = (liveCropState[slot] && liveCropState[slot][pz.id]) || {zoom:1,offsetX:0,offsetY:0};
          const baseScale = Math.max(zw/iw, zh/ih);
          const scale = baseScale * crop.zoom;
          const sw=iw*scale, sh=ih*scale;
          const ox=zx+(zw-sw)/2+crop.offsetX, oy=zy+(zh-sh)/2+crop.offsetY;
          ctx.save();
          ctx.beginPath(); ctx.rect(zx,zy,zw,zh); ctx.clip();
          ctx.drawImage(img, ox, oy, sw, sh);
          ctx.restore();
          resolve();
        };
        img.onerror = resolve;
        img.src = ev.target.result;
      };
      reader.onerror = resolve;
      reader.readAsDataURL(fileInput.files[0]);
    });
  }

  if (d.design_url && photoZones.length > 0) {
    await new Promise(resolve => {
      const img = new Image();
      img.onload = () => { ctx.drawImage(img, 0, 0, W, H); resolve(); };
      img.onerror = resolve;
      img.src = d.design_url;
    });
  }

  const userTexts = {}, userColors = {};
  document.querySelectorAll('.lta').forEach(ta => { userTexts[ta.dataset.zid] = ta.value; });
  if (slotZoneColors && slotZoneColors[slot]) Object.assign(userColors, slotZoneColors[slot]);

  const fontsToLoad = [...new Set((d.text_zones||[]).map(z=>z.font_family).filter(Boolean))];
  const fontForcer = document.createElement('div');
  fontForcer.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none;';
  fontsToLoad.forEach(font => {
    const span = document.createElement('span');
    span.style.fontFamily = `'${font}'`;
    span.textContent = 'AaBbCc';
    fontForcer.appendChild(span);
    if (!document.querySelector(`link[href*="${font.replace(/\s+/g,'+')}"]`)) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `https://fonts.googleapis.com/css2?family=${font.replace(/\s+/g,'+')}:wght@400;700&display=swap`;
      document.head.appendChild(link);
    }
  });
  document.body.appendChild(fontForcer);
  await document.fonts.ready;
  for (const font of fontsToLoad) {
    try { await document.fonts.load(`48px '${font}'`); } catch(e) {}
  }
  await new Promise(r => setTimeout(r, 800));
  document.body.removeChild(fontForcer);

  const fontStatuses = await Promise.all(fontsToLoad.map(async f => ({name:f, ok: await document.fonts.check(`48px '${f}'`)})));
  const detectedColors = [...new Set((d.text_zones||[]).map(z => userColors[z.id]||z.color).filter(Boolean))];

  const confirmed = await new Promise(resolve => {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:99998;display:flex;align-items:center;justify-content:center;font-family:Jost,sans-serif;';
    const fontLines = fontStatuses.map(f =>
      `<div style="display:flex;align-items:center;gap:8px;margin:3px 0;"><span style="color:${f.ok?'#4caf50':'#e06c75'};font-size:16px;">${f.ok?'✅':'❌'}</span><span style="font-size:13px;color:#F0E8D8;">${f.name}</span><span style="font-size:11px;color:${f.ok?'#4caf50':'#e06c75'}">${f.ok?'Chargée':'Non chargée'}</span></div>`
    ).join('');
    const colorSwatches = detectedColors.map(c =>
      `<div style="display:inline-flex;align-items:center;gap:6px;margin:3px;"><div style="width:18px;height:18px;border-radius:3px;background:${c};border:1px solid rgba(255,255,255,0.2);"></div><span style="font-size:12px;color:#F0E8D8;">${c}</span></div>`
    ).join('');
    ov.innerHTML = `<div style="background:#151210;border:1px solid rgba(201,169,110,0.3);border-radius:16px;padding:28px;width:420px;max-height:80vh;overflow-y:auto;">
      <div style="color:#C9A96E;font-size:16px;font-weight:700;margin-bottom:16px;text-align:center">📋 Vérification avant impression</div>
      <div style="background:#1a1612;border-radius:8px;padding:12px;margin-bottom:12px;">
        <div style="font-size:11px;color:rgba(201,169,110,0.7);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;">Polices</div>
        ${fontLines||'<div style="color:#888;font-size:12px;">Aucune police spécifique</div>'}
      </div>
      <div style="background:#1a1612;border-radius:8px;padding:12px;margin-bottom:12px;">
        <div style="font-size:11px;color:rgba(201,169,110,0.7);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;">Contour des lettres</div>
        <div style="display:flex;align-items:center;gap:8px;"><span style="color:#4caf50;font-size:16px;">✅</span><span style="font-size:13px;color:#F0E8D8;">Activé — épaisseur 2.5px</span></div>
      </div>
      <div style="background:#1a1612;border-radius:8px;padding:12px;margin-bottom:16px;">
        <div style="font-size:11px;color:rgba(201,169,110,0.7);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;">Couleurs</div>
        ${colorSwatches||'<div style="color:#888;font-size:12px;">Aucune</div>'}
      </div>
      <div style="display:flex;gap:8px;">
        <button id="png-cancel" style="flex:1;padding:10px;background:#2a2018;border:none;border-radius:8px;color:#F0E8D8;cursor:pointer;font-family:Jost,sans-serif;">Annuler</button>
        <button id="png-ok" style="flex:2;padding:10px;background:linear-gradient(135deg,#C9A96E,#E8D5A3);border:none;border-radius:8px;color:#0d0d0d;font-weight:700;cursor:pointer;font-family:Jost,sans-serif;">📥 Télécharger le PNG</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    document.getElementById('png-ok').onclick = () => { document.body.removeChild(ov); resolve(true); };
    document.getElementById('png-cancel').onclick = () => { document.body.removeChild(ov); resolve(false); };
  });

  if (!confirmed) return;

  const STROKE_WIDTH = 2.5;
  (d.text_zones||[]).forEach(z => {
    const rawText = (userTexts[z.id] !== undefined ? userTexts[z.id] : (z.placeholder||'')).trim();
    if (!rawText) return;
    const lh = z.lineHeight||1.3;
    const lines = rawText.split('\n');
    let fs = z.font_size||48;
    const zw=z.width, zh=z.height, zx=z.x, zy=z.y;
    while (fs > 6) {
      ctx.font = `${fs}px '${z.font_family||'Jost'}'`;
      const maxW = Math.max(...lines.map(l => ctx.measureText(l).width));
      const m = ctx.measureText('Agyjpq');
      const realH = (m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) || fs*0.8;
      const totalH = lines.length * realH + (lines.length-1) * (fs*(lh-1));
      if (maxW <= zw && totalH <= zh) break;
      fs -= 1;
    }
    const cx=zx+zw/2, cy=zy+zh/2;
    const angle=(z.rotation||0)*Math.PI/180;
    ctx.save();
    if (angle){ctx.translate(cx,cy);ctx.rotate(angle);ctx.translate(-cx,-cy);}
    ctx.font = `${fs}px '${z.font_family||'Jost'}'`;
    ctx.textAlign = z.align||'center';
    ctx.textBaseline = 'middle';
    const tx = z.align==='left'?zx+8:z.align==='right'?zx+zw-8:zx+zw/2;
    const lineH=fs*lh, totalH=lines.length*lineH;
    const startY = cy - totalH/2 + lineH/2;
    const color = userColors[z.id]||z.color||'#7a5c2e';
    ctx.strokeStyle=color; ctx.lineWidth=STROKE_WIDTH; ctx.lineJoin='round';
    lines.forEach((line,i) => ctx.strokeText(line, tx, startY+i*lineH));
    ctx.fillStyle=color;
    lines.forEach((line,i) => ctx.fillText(line, tx, startY+i*lineH));
    ctx.restore();
  });

  const fn=(fileName||d.name||'design').replace(/[^a-zA-Z0-9-_ ]/g,'').trim()+'-imprimeur.png';
  return new Promise(resolve => {
    canvas.toBlob(blob => {
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=fn;a.click();
      setTimeout(()=>URL.revokeObjectURL(url),2000);
      resolve();
    },'image/png');
  });
}

document.getElementById('btnPwd').addEventListener('click',()=>{
  function h(s){let v=0x811c9dc5;for(let i=0;i<s.length;i++){v^=s.charCodeAt(i);v=(v*0x01000193)>>>0;}return v.toString(16).padStart(8,'0')+(v^0xdeadbeef).toString(16).padStart(8,'0');}
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:9998;display:flex;align-items:center;justify-content:center;font-family:Jost,sans-serif;';
  ov.innerHTML=`<div style="background:#12100D;border:1px solid rgba(201,169,110,0.22);border-radius:18px;padding:38px;width:370px;text-align:center">

    <input id="p1" type="password" placeholder="Mot de passe actuel" style="width:100%;padding:9px;background:rgba(201,169,110,0.05);border:1px solid rgba(201,169,110,0.18);border-radius:7px;color:#F0E8D8;font-size:13px;box-sizing:border-box;outline:none;margin-bottom:7px;font-family:Jost,sans-serif">
    <input id="p2" type="password" placeholder="Nouveau mot de passe" style="width:100%;padding:9px;background:rgba(201,169,110,0.05);border:1px solid rgba(201,169,110,0.18);border-radius:7px;color:#F0E8D8;font-size:13px;box-sizing:border-box;outline:none;margin-bottom:7px;font-family:Jost,sans-serif">
    <input id="p3" type="password" placeholder="Confirmer" style="width:100%;padding:9px;background:rgba(201,169,110,0.05);border:1px solid rgba(201,169,110,0.18);border-radius:7px;color:#F0E8D8;font-size:13px;box-sizing:border-box;outline:none;margin-bottom:12px;font-family:Jost,sans-serif">
    <div id="perr" style="font-size:12px;color:#E06C75;min-height:16px;margin-bottom:10px"></div>
    <div style="display:flex;gap:7px">
      <button id="pcan" style="flex:1;padding:9px;background:#1e1a14;border:none;border-radius:7px;color:#F0E8D8;cursor:pointer;font-family:Jost,sans-serif">Annuler</button>
      <button id="pok" style="flex:2;padding:9px;background:linear-gradient(135deg,#C9A96E,#E8D5A3);border:none;border-radius:7px;color:#0a0805;font-weight:700;cursor:pointer;font-family:Jost,sans-serif">Changer</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  document.getElementById('pcan').onclick=()=>document.body.removeChild(ov);
  document.getElementById('pok').onclick=()=>{
    const cur=document.getElementById('p1').value,nw=document.getElementById('p2').value,cf=document.getElementById('p3').value;
    const stored=localStorage.getItem(LHASHKEY)||h('kuztom-live');
    if(h(cur)!==stored){document.getElementById('perr').textContent='❌ Incorrect';return;}
    if(nw.length<6){document.getElementById('perr').textContent='❌ Min. 6 caractères';return;}
    if(nw!==cf){document.getElementById('perr').textContent='❌ Mots de passe différents';return;}
    localStorage.setItem(LHASHKEY,h(nw));document.body.removeChild(ov);alert('✅ Changé !');
  };
});

var CACHE_KEY='kuztom_designs_cache';
function applyDesigns(data){
  try{
    designs=data.filter(function(d){return d.active!==false&&d.name;})
      .map(function(d){return{id:d.id,name:d.name,shopify_handle:d.shopify_handle,text_zones:d.text_zones,photo_zones:d.photo_zones,arch_zones:d.arch_zones,design:d.design,design_url:d.design_url,variant_colors:d.variant_colors,active:d.active};})
      .sort(function(a,b){return a.name.localeCompare(b.name,'fr');});
    renderGallery();
    if(designs.length>0){
      try{loadDesignInSlot('a',designs[0]);}catch(e){console.warn('loadDesignInSlot',e);}
      try{selectSlot('a');}catch(e){console.warn('selectSlot',e);}
    }
    setTimeout(resizeViewers,200);
  }catch(e){console.error('applyDesigns error',e);}
}
function saveCache(data){try{localStorage.setItem(CACHE_KEY,JSON.stringify(data.map(function(d){return{id:d.id,name:d.name,shopify_handle:d.shopify_handle,text_zones:d.text_zones,photo_zones:d.photo_zones,arch_zones:d.arch_zones,design:d.design,design_url:d.design_url,variant_colors:d.variant_colors,active:d.active};})));}catch(e){}}
function loadCache(){try{var s=localStorage.getItem(CACHE_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function fetchFromNetwork(onSuccess,onFail){
  var urls=['https://clcreation542-coder.github.io/Code-3D/designs.json','https://raw.githubusercontent.com/clcreation542-coder/Code-3D/main/designs.json'];
  function attempt(i){
    if(i>=urls.length){if(onFail)onFail();return;}
    fetch(urls[i]).then(function(r){return r.ok?r.json():Promise.reject(r.status);})
      .then(function(data){saveCache(data);if(onSuccess)onSuccess(data);}).catch(function(){attempt(i+1);});
  }
  attempt(0);
}
function initApp(){
  renderLib();renderPresets();
  var cached=loadCache();
  if(cached&&cached.length>0){
    applyDesigns(cached);
    fetchFromNetwork(function(data){applyDesigns(data);},null);
  }else{
    document.getElementById('glist').innerHTML='<div style="padding:14px;color:var(--muted);font-size:12px">Chargement...</div>';
    fetchFromNetwork(function(data){applyDesigns(data);},function(){
      document.getElementById('glist').innerHTML='<div style="padding:14px;color:var(--muted);font-size:12px">Impossible de charger.<br><button id="btnRetry" style="margin-top:8px;padding:5px 12px;background:rgba(201,169,110,0.15);border:1px solid rgba(201,169,110,0.3);border-radius:6px;color:#C9A96E;cursor:pointer;font-family:Jost,sans-serif;font-size:11px">↺ Réessayer</button></div>';
      document.getElementById('btnRetry').addEventListener('click',function(){localStorage.removeItem(CACHE_KEY);document.getElementById('glist').innerHTML='<div style="padding:14px;color:var(--muted);font-size:12px">Chargement...</div>';fetchFromNetwork(function(data){applyDesigns(data);},arguments.callee);});
    });
  }
}
</script>
