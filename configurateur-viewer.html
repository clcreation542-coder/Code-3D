<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewer Gobelet — Kuztom</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #a8a5a1;
    }

    #viewer {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
      background: #a8a5a1;
    }

    #canvas-container canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    #loading-indicator {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #efefed;
      z-index: 5;
      transition: opacity 400ms ease;
    }

    #loading-indicator.hidden { opacity: 0; pointer-events: none; }

    .loading-ring {
      width: 32px;
      height: 32px;
      border: 1.5px solid #e0ddd8;
      border-top-color: #c9a96e;
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }

    .loading-text {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #aaa;
      font-family: 'Inter', sans-serif;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #error-msg {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #888;
      text-align: center;
      padding: 24px;
      background: #efefed;
      z-index: 10;
    }
    #error-msg.visible { display: flex; }
  </style>
</head>
<body>

<div id="viewer">
  <div id="canvas-container">
    <div id="loading-indicator">
      <div class="loading-ring"></div>
      <span class="loading-text">Chargement</span>
    </div>
  </div>
  <div id="error-msg">
    <span style="font-size:24px">&#9888;</span>
    <span id="error-text">Design introuvable.</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

<script>
const params     = new URLSearchParams(window.location.search);
const designName = params.get('design') || '';
const REPO_BASE  = 'https://clcreation542-coder.github.io/Code-3D';
const forcedW    = parseInt(params.get('w')) || 0;
const forcedH    = parseInt(params.get('h')) || 0;

function getSize(container) {
  var w = window.innerWidth || 375;
  return { w: w, h: w };
}

let CFG = {
  id: '', name: '',
  gobelet_color: '#f5f0eb', gobelet_opacity: 0.88,
  rotation_y: 0, model_url: null,
  design_url: null,
  design: { x: 0, y: 0, width: 2000, height: 1024 },
  variant_colors: [], text_zones: [], photo_zones: []
};

const state = {
  texts:        {},
  photos:       {},
  gobeletColor: '#f5f0eb',
  designImage:  null,
  fontsReady:   false,
};

const TEX_W = 2000, TEX_H = 1024;
const textureCanvas  = document.createElement('canvas');
textureCanvas.width  = TEX_W;
textureCanvas.height = TEX_H;
const ctx2d = textureCanvas.getContext('2d');

function parseHexColor(c) { return (c && c.startsWith('#')) ? c : '#ffffff'; }

function getFontSize(zone, text) {
  let size = zone.font_size || 48;
  const lh = zone.lineHeight || 1.3;
  const lines = text.split('\n');
  while (size > 8) {
    ctx2d.font = `${size}px "${zone.font_family}"`;
    const maxW   = Math.max(...lines.map(l => ctx2d.measureText(l).width));
    const totalH = lines.length * size * lh;
    if (maxW <= zone.width && totalH <= zone.height) break;
    size -= 1;
  }
  return size;
}

function drawTextZone(zone, text) {
  if (!text || !text.trim()) return;
  const lh     = zone.lineHeight || 1.3;
  const size   = getFontSize(zone, text);
  const lines  = text.split('\n');
  const lineH  = size * lh;
  const totalH = lines.length * lineH;
  const cx     = zone.x + zone.width / 2;
  const cy     = zone.y + zone.height / 2;
  const angle  = (zone.rotation || 0) * Math.PI / 180;
  ctx2d.save();
  if (angle) { ctx2d.translate(cx, cy); ctx2d.rotate(angle); ctx2d.translate(-cx, -cy); }
  ctx2d.font         = `${size}px "${zone.font_family}"`;
  ctx2d.fillStyle    = zone.color || '#2c2521';
  ctx2d.textAlign    = zone.align || 'center';
  ctx2d.textBaseline = 'middle';
  const startY = cy - totalH / 2 + lineH / 2;
  const startX = zone.align === 'center' ? cx
               : zone.align === 'right'  ? zone.x + zone.width
               : zone.x;
  lines.forEach((line, i) => ctx2d.fillText(line, startX, startY + i * lineH));
  ctx2d.restore();
}

function drawPhotoZone(zone, img) {
  const zx = zone.x, zy = zone.y, zw = zone.width, zh = zone.height;
  const iw = img.naturalWidth  || img.width  || 1;
  const ih = img.naturalHeight || img.height || 1;
  const scale = Math.max(zw / iw, zh / ih);
  const sw = iw * scale, sh = ih * scale;
  const ox = zx + (zw - sw) / 2, oy = zy + (zh - sh) / 2;
  ctx2d.save();
  ctx2d.beginPath();
  ctx2d.rect(zx, zy, zw, zh);
  ctx2d.clip();
  ctx2d.drawImage(img, ox, oy, sw, sh);
  ctx2d.restore();
}

function drawTexture() {
  ctx2d.clearRect(0, 0, TEX_W, TEX_H);
  const op = CFG.gobelet_opacity !== undefined ? CFG.gobelet_opacity : 0.88;
  const isSolid = (op === 0);

  if (isSolid) {
    /* Opacité 0 = gobelet blanc 100% opaque */
    ctx2d.globalAlpha = 1;
    ctx2d.fillStyle   = '#ffffff';
    ctx2d.fillRect(0, 0, TEX_W, TEX_H);
    if (bodyMaterial) {
      bodyMaterial.transparent = false;
      bodyMaterial.opacity     = 1;
      bodyMaterial.depthWrite  = true;
      bodyMaterial.needsUpdate = true;
    }
  } else {
    /* Opacité > 0 = gobelet translucide normal */
    ctx2d.globalAlpha = op;
    ctx2d.fillStyle   = parseHexColor(state.gobeletColor);
    ctx2d.fillRect(0, 0, TEX_W, TEX_H);
    if (bodyMaterial) {
      bodyMaterial.transparent = true;
      bodyMaterial.opacity     = 0.82;
      bodyMaterial.depthWrite  = false;
      bodyMaterial.alphaTest   = 0;
      bodyMaterial.needsUpdate = true;
    }
  }

  ctx2d.globalAlpha = 1.0;
  ctx2d.globalCompositeOperation = 'source-over';
  if (state.designImage) {
    const d = CFG.design || { x: 0, y: 0, width: TEX_W, height: TEX_H };
    ctx2d.drawImage(state.designImage, d.x, d.y, d.width, d.height);
  }
  (CFG.photo_zones || []).forEach(zone => {
    const img = state.photos[zone.id];
    if (img) drawPhotoZone(zone, img);
  });
  (CFG.text_zones || []).forEach(zone => {
    const txt = state.texts[zone.id] !== undefined ? state.texts[zone.id] : (zone.placeholder || '');
    drawTextZone(zone, txt);
  });
  if (window._gobeletTexture) window._gobeletTexture.needsUpdate = true;
}

async function loadDesignConfig() {
  if (!designName) return;
  const url = 'https://raw.githubusercontent.com/clcreation542-coder/Code-3D/main/designs.json?t=' + Date.now();
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const designs = await res.json();
    const data = Array.isArray(designs) ? designs.find(d => d.id === designName) : null;
    if (!data) throw new Error('design non trouvé dans designs.json');
    CFG = data;
    state.gobeletColor = CFG.gobelet_color || '#f5f0eb';
    (CFG.text_zones || []).forEach(z => { state.texts[z.id] = z.placeholder || ''; });
  } catch (e) {
    showError(`Design "${designName}" introuvable (${e.message})`);
  }
}

async function loadFonts() {
  const families = [...new Set((CFG.text_zones || []).map(z => z.font_family).filter(Boolean))];
  if (!families.length) { state.fontsReady = true; return; }
  await new Promise(resolve => {
    const link  = document.createElement('link');
    link.rel    = 'stylesheet';
    link.href   = 'https://fonts.googleapis.com/css2?family=' +
      families.map(f => f.replace(/ /g, '+')).join('&family=') + '&display=swap';
    link.onload  = resolve;
    link.onerror = resolve;
    document.head.appendChild(link);
  });
  try {
    await Promise.all(families.map(f => {
      const zone = (CFG.text_zones || []).find(z => z.font_family === f);
      return document.fonts.load(`${(zone && zone.font_size) || 48}px "${f}"`);
    }));
  } catch (_) {}
  state.fontsReady = true;
}

function loadDesignImage() {
  if (!CFG.design_url) return Promise.resolve();
  return new Promise(resolve => {
    const img = new Image();
    const isDataUrl = CFG.design_url.startsWith('data:');
    if (!isDataUrl) img.crossOrigin = 'anonymous';
    img.onload  = () => { state.designImage = img; resolve(); };
    img.onerror = () => {
      if (!isDataUrl && img.crossOrigin) {
        const retry = new Image();
        retry.onload  = () => { state.designImage = retry; resolve(); };
        retry.onerror = () => resolve();
        retry.src = CFG.design_url;
      } else { resolve(); }
    };
    if (isDataUrl) {
      img.src = CFG.design_url;
    } else {
      let url = CFG.design_url;
      if (!url.startsWith('http') && !url.startsWith('//')) {
        url = REPO_BASE + '/' + url.replace(/^\//, '');
      }
      img.src = url + (url.includes('?') ? '&' : '?') + '_v=' + Date.now();
    }
  });
}

let renderer, scene, camera, gobeletGroup, bodyMaterial;
let storedCameraZ = 5;
let isDragging = false, lastPointerX = 0;
let rotY = Math.PI;

function initThree() {
  const container = document.getElementById('canvas-container');
  var size = getSize(container);
  var w = size.w, h = size.h;

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(w, h);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.domElement.style.display = 'block';
  container.appendChild(renderer.domElement);

  scene = new THREE.Scene();

  /* ── Fond avec dégradé + lignes de perspective ─────────────────
     Les lignes sont dessinées directement dans le canvas de fond
     Three.js → naturellement derrière le gobelet, aucun z-index,
     aucun risque Android. ──────────────────────────────────────── */
  const bgCanvas  = document.createElement('canvas');
  bgCanvas.width  = bgCanvas.height = 512;
  const bgCtx     = bgCanvas.getContext('2d');

  /* Dégradé radial — gris chaud professionnel */
  const gradient  = bgCtx.createRadialGradient(256, 256, 0, 256, 256, 380);
  gradient.addColorStop(0, '#dddbd8');
  gradient.addColorStop(1, '#a8a5a1');
  bgCtx.fillStyle = gradient;
  bgCtx.fillRect(0, 0, 512, 512);

  /* Deux lignes de perspective en bas — coin de pièce */
  bgCtx.strokeStyle = 'rgba(148, 136, 126, 0.38)';
  bgCtx.lineWidth   = 1.2;
  bgCtx.lineCap     = 'round';
  /* Ligne gauche : du bas-gauche vers le centre-bas */
  bgCtx.beginPath();
  bgCtx.moveTo(0,   512);
  bgCtx.lineTo(256, 370);
  bgCtx.stroke();
  /* Ligne droite : du bas-droit vers le centre-bas */
  bgCtx.beginPath();
  bgCtx.moveTo(512, 512);
  bgCtx.lineTo(256, 370);
  bgCtx.stroke();

  scene.background = new THREE.CanvasTexture(bgCanvas);

  camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
  camera.position.set(0, 0, 5);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(3, 5, 3);
  dirLight.castShadow = true;
  scene.add(dirLight);
  const backLight = new THREE.DirectionalLight(0xffffff, 0.8);
  backLight.position.set(-3, 2, -3);
  scene.add(backLight);

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(10, 10),
    new THREE.ShadowMaterial({ opacity: 0.15 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -1.5;
  floor.receiveShadow = true;
  scene.add(floor);

  const gobeletTexture          = new THREE.CanvasTexture(textureCanvas);
  gobeletTexture.wrapS          = THREE.RepeatWrapping;
  gobeletTexture.wrapT          = THREE.RepeatWrapping;
  gobeletTexture.repeat.set(1, 1);
  gobeletTexture.offset.set(0, 0);
  gobeletTexture.flipY          = false;
  gobeletTexture.encoding       = THREE.sRGBEncoding;
  window._gobeletTexture        = gobeletTexture;

  bodyMaterial = new THREE.MeshStandardMaterial({
    map:         gobeletTexture,
    color:       new THREE.Color('#ffffff'),
    roughness:   0.3,
    metalness:   0.1,
    transparent: true,
    opacity:     0.82,
    depthWrite:  false,
    alphaTest:   0,
    side:        THREE.FrontSide,
  });
  bodyMaterial.needsUpdate = true;

  rotY = CFG.rotation_y !== undefined ? (Math.PI + CFG.rotation_y) : Math.PI;

  gobeletGroup = new THREE.Group();
  gobeletGroup.rotation.x = 0.035; /* 2° exactement */
  gobeletGroup.rotation.y = rotY;
  scene.add(gobeletGroup);

  loadGobelet();
  initInteraction();
  window.addEventListener('resize', onResize);
  onResize();
  animate();
}

function loadGobelet() {
  const url = CFG.model_url || `${REPO_BASE}/Gobelet 25 33.glb`;
  if (typeof THREE.GLTFLoader === 'undefined') { fallbackGeometry(); return; }
  const loader = new THREE.GLTFLoader();
  if (typeof THREE.DRACOLoader !== 'undefined') {
    const draco = new THREE.DRACOLoader();
    draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
    loader.setDRACOLoader(draco);
  }
  loader.load(url, gltf => {
    gltf.scene.traverse(child => {
      if (!child.isMesh) return;
      child.material = new THREE.MeshStandardMaterial({
        map:         window._gobeletTexture,
        color:       new THREE.Color('#ffffff'),
        roughness:   0.3,
        metalness:   0.1,
        transparent: true,
        opacity:     0.82,
        depthWrite:  false,
        alphaTest:   0,
        side:        THREE.FrontSide,
      });
      child.material.needsUpdate = true;
      child.castShadow = false;
    });
    gltf.scene.traverse(child => { if (child.isMesh) bodyMaterial = child.material; });
    gobeletGroup.add(gltf.scene);
    const box    = new THREE.Box3().setFromObject(gobeletGroup);
    const size   = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    gobeletGroup.position.sub(center);
    const scaleFactor = 1.746 / size.y;
    gobeletGroup.scale.setScalar(scaleFactor);
    gobeletGroup.rotation.x = 0.035; /* 2° exactement */
    gobeletGroup.rotation.z = 0;
    gobeletGroup.scale.setScalar(gobeletGroup.scale.x * 0.805);
    gobeletGroup.position.y -= 0.02;
    gobeletGroup.rotation.y  = rotY;

    gobeletGroup.updateMatrixWorld(true);
    var finalBox  = new THREE.Box3().setFromObject(gobeletGroup);
    var finalSize = finalBox.getSize(new THREE.Vector3());
    var finalMax  = Math.max(finalSize.x, finalSize.y, finalSize.z);
    storedCameraZ = (finalMax / 2) / Math.tan((45 * Math.PI / 180) / 2) * 1.32;
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();

    /* disc1 supprimé : évitait la bande blanche visible sous le gobelet */
    const boxDisc = new THREE.Box3().setFromObject(gobeletGroup);

    gobeletGroup.updateMatrixWorld(true);
    /* disc2 supprimé : évite la bande blanche visible sous le gobelet */

    gobeletGroup.updateMatrixWorld(true);
    /* shadow supprimé : trop visible avec le fond gris */

    onResize();
    drawTexture();
    requestAnimationFrame(() => { if (window._gobeletTexture) window._gobeletTexture.needsUpdate = true; });
    hideLoading();
  }, null, () => fallbackGeometry());
}

function fallbackGeometry() {
  gobeletGroup.add(new THREE.Mesh(
    new THREE.CylinderGeometry(1.12, 0.88, 2.9, 64, 1, true),
    bodyMaterial
  ));
  const bottom = new THREE.Mesh(
    new THREE.CircleGeometry(0.88, 64),
    new THREE.MeshStandardMaterial({
      color: new THREE.Color(parseHexColor(state.gobeletColor)),
      roughness: 0.35, metalness: 0.04,
    })
  );
  bottom.rotation.x = -Math.PI / 2;
  bottom.position.y = -1.45;
  gobeletGroup.add(bottom);
  drawTexture();
  hideLoading();
}

function hideLoading() {
  const el = document.getElementById('loading-indicator');
  if (el) {
    el.classList.add('hidden');
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
  }
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

function initInteraction() {
  const el = renderer.domElement;
  el.addEventListener('mousedown', e => { isDragging = true; lastPointerX = e.clientX; });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    rotY += (e.clientX - lastPointerX) * 0.01;
    lastPointerX = e.clientX;
    gobeletGroup.rotation.y = rotY;
  });
  window.addEventListener('mouseup', () => { isDragging = false; });
  el.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    isDragging = true; lastPointerX = e.touches[0].clientX;
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (!isDragging || e.touches.length !== 1) return;
    rotY += (e.touches[0].clientX - lastPointerX) * 0.01;
    lastPointerX = e.touches[0].clientX;
    gobeletGroup.rotation.y = rotY;
    e.preventDefault();
  }, { passive: false });
  el.addEventListener('touchend', () => { isDragging = false; });
}

function onResize() {
  if (!renderer) return;
  var container = document.getElementById('canvas-container');
  var size = getSize(container);
  var w = size.w, h = size.h;
  if (w === 0 || h === 0) return;
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.position.set(0, 0, storedCameraZ);
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
}

window.addEventListener('message', function(e) {
  const data = e.data;
  if (!data || typeof data !== 'object') return;

  if (data.type === 'UPDATE_TEXT' && data.zoneId !== undefined && data.value !== undefined) {
    const zone = (CFG.text_zones || []).find(function(z) { return z.id === data.zoneId; });
    if (zone) {
      state.texts[zone.id] = data.value;
      drawTexture();
      if (bodyMaterial && bodyMaterial.map) bodyMaterial.map.needsUpdate = true;
    }
  }

  if (data.type === 'UPDATE_COLOR' && data.value) {
    state.gobeletColor = data.value;
    if (data.opacity !== undefined) CFG.gobelet_opacity = data.opacity;
    drawTexture();
    if (bodyMaterial && bodyMaterial.map) bodyMaterial.map.needsUpdate = true;
  }

  if (data.type === 'UPDATE_PHOTO' && data.zoneId && data.value) {
    const img = new Image();
    img.onload = function() {
      state.photos[data.zoneId] = img;
      drawTexture();
      if (bodyMaterial && bodyMaterial.map) bodyMaterial.map.needsUpdate = true;
    };
    img.src = data.value;
  }
});

function showError(msg) {
  const el  = document.getElementById('error-msg');
  const txt = document.getElementById('error-text');
  if (txt) txt.textContent = msg;
  if (el)  el.classList.add('visible');
  hideLoading();
}

async function init() {
  await loadDesignConfig();
  await Promise.all([loadFonts(), loadDesignImage()]);
  drawTexture();
  initThree();
  window.parent.postMessage({ type: 'kuztom_ready' }, '*');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
