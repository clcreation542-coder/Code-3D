<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Designs — kuztom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #1a1a2e;
  --surface:  #16213e;
  --surface2: #0f3460;
  --gold:     #c9a96e;
  --gold-lt:  rgba(201,169,110,0.15);
  --text:     #e8e0d0;
  --muted:    rgba(232,224,208,0.5);
  --border:   rgba(201,169,110,0.2);
  --border-lt:rgba(255,255,255,0.07);
  --radius:   8px;
  --rsm:      4px;
  --danger:   #e06c75;
}

html, body {
  height: 100%; overflow: hidden;
  font-family: 'Jost', sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 13px; line-height: 1.5;
}

/* ── Header ── */
#header {
  height: 52px; flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px; gap: 10px;
  z-index: 100;
}
#header-title {
  font-size: 15px; font-weight: 600;
  color: var(--gold); letter-spacing: 0.4px;
  margin-right: auto;
}
#container-type {
  width: 170px; padding: 5px 8px;
  background: var(--bg);
  border: 1px solid var(--border-lt);
  border-radius: var(--rsm);
  color: var(--text);
  font-family: 'Jost', sans-serif;
  font-size: 12px; outline: none;
}

/* ── Layout ── */
#layout {
  display: flex;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Left col ── */
#col-left {
  width: 260px; flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
#col-left-header {
  padding: 12px;
  border-bottom: 1px solid var(--border-lt);
  display: flex; flex-direction: column; gap: 8px;
}
#btn-new {
  width: 100%; padding: 8px;
  background: var(--gold); color: #1a1a2e;
  border: none; border-radius: var(--rsm);
  font-family: 'Jost', sans-serif;
  font-size: 13px; font-weight: 600;
  cursor: pointer; transition: opacity 0.15s;
}
#btn-new:hover { opacity: 0.85; }
#search-wrap { position: relative; }
#search-wrap svg {
  position: absolute; left: 8px; top: 50%;
  transform: translateY(-50%);
  pointer-events: none; opacity: 0.4;
}
#search-input {
  width: 100%; padding: 6px 8px 6px 28px;
  background: var(--bg);
  border: 1px solid var(--border-lt);
  border-radius: var(--rsm);
  color: var(--text);
  font-family: 'Jost', sans-serif;
  font-size: 12px; outline: none;
}
#search-input:focus { border-color: var(--gold); }
#design-list { flex: 1; overflow-y: auto; padding: 6px; }
.design-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px; border-radius: var(--rsm);
  cursor: pointer; transition: background 0.12s;
  border: 1px solid transparent;
  position: relative;
}
.design-item:hover { background: var(--gold-lt); }
.design-item.active { border-color: var(--gold); background: var(--gold-lt); }
.design-thumb {
  width: 50px; height: 25px; flex-shrink: 0;
  border-radius: 3px; border: 1px solid var(--border-lt);
  overflow: hidden; background: #2a2a4a;
}
.design-thumb canvas { display: block; width: 100%; height: 100%; }
.design-name {
  flex: 1; font-size: 12px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.btn-dup {
  display: none; padding: 2px 6px;
  font-size: 11px; flex-shrink: 0;
  background: var(--surface2);
  border: 1px solid var(--border-lt);
  border-radius: 3px; color: var(--muted);
  cursor: pointer; font-family: 'Jost', sans-serif;
  transition: color 0.12s, border-color 0.12s;
}
.btn-dup:hover { color: var(--gold); border-color: var(--gold); }
.design-item:hover .btn-dup { display: block; }

/* ── Center col ── */
#col-center {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; background: var(--bg); min-width: 0;
}
#canvas-toolbar {
  padding: 8px 14px; flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--border-lt);
}
.tool-btn {
  padding: 5px 14px;
  background: var(--surface);
  border: 1px solid var(--border-lt);
  border-radius: var(--rsm);
  color: var(--muted);
  font-family: 'Jost', sans-serif;
  font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.12s;
}
.tool-btn:hover { color: var(--text); border-color: var(--border); }
.tool-btn.active { background: var(--gold-lt); border-color: var(--gold); color: var(--gold); }
#canvas-area {
  flex: 1; overflow: auto;
  display: flex; flex-direction: column;
  align-items: center; padding: 16px; gap: 16px;
}
#canvas-wrap {
  position: relative; flex-shrink: 0;
  box-shadow: 0 4px 32px rgba(0,0,0,0.6);
  border-radius: var(--rsm); overflow: hidden;
  background: #2a2a4a;
}
#editor-canvas { display: block; }
#preview-section { flex-shrink: 0; text-align: center; }
#preview-section h3 {
  font-size: 10px; font-weight: 600;
  color: var(--muted); letter-spacing: 0.8px;
  text-transform: uppercase; margin-bottom: 8px;
}
#preview-canvas {
  display: block; border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border-lt);
}

/* ── Right col ── */
#col-right {
  width: 300px; flex-shrink: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
  overflow-y: auto;
}
#props-panel { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.psection { display: flex; flex-direction: column; gap: 9px; }
.psection-title {
  font-size: 10px; font-weight: 600;
  color: var(--gold); text-transform: uppercase;
  letter-spacing: 0.9px;
  padding-bottom: 5px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}

/* ── Form elements ── */
.field { display: flex; flex-direction: column; gap: 3px; }
.field label { font-size: 11px; color: var(--muted); font-weight: 500; }
.frow { display: flex; gap: 7px; align-items: flex-end; }
.frow .field { flex: 1; }

input[type="text"],
input[type="number"],
textarea,
select {
  background: var(--bg); border: 1px solid var(--border-lt);
  border-radius: var(--rsm); padding: 6px 8px;
  color: var(--text); font-family: 'Jost', sans-serif;
  font-size: 13px; outline: none; width: 100%;
  transition: border-color 0.12s;
}
input:focus, textarea:focus, select:focus { border-color: var(--gold); }
textarea { resize: vertical; min-height: 54px; }
select option { background: var(--surface); }
input[type="color"] {
  width: 34px; height: 28px; padding: 2px;
  border-radius: var(--rsm);
  border: 1px solid var(--border-lt);
  background: var(--bg); cursor: pointer; flex-shrink: 0;
}

.color-row { display: flex; align-items: center; gap: 6px; }
.color-row input[type="text"] { flex: 1; }

/* Align buttons */
.align-btns { display: flex; gap: 4px; }
.align-btn {
  flex: 1; padding: 5px 4px;
  background: var(--bg); border: 1px solid var(--border-lt);
  border-radius: var(--rsm); color: var(--muted);
  cursor: pointer; font-size: 12px; text-align: center;
  transition: all 0.12s; font-family: 'Jost', sans-serif;
}
.align-btn:hover { color: var(--text); }
.align-btn.active { background: var(--gold-lt); border-color: var(--gold); color: var(--gold); }

/* Toggle */
.toggle-row { display: flex; align-items: center; justify-content: space-between; }
.toggle-row span { font-size: 12px; color: var(--text); }
.toggle { position: relative; width: 34px; height: 18px; }
.toggle input { display: none; }
.toggle-sl {
  position: absolute; inset: 0;
  background: var(--bg); border-radius: 9px;
  cursor: pointer; transition: background 0.15s;
  border: 1px solid var(--border-lt);
}
.toggle-sl::before {
  content: ''; position: absolute;
  width: 12px; height: 12px;
  background: var(--muted); border-radius: 50%;
  top: 2px; left: 2px;
  transition: transform 0.15s, background 0.15s;
}
.toggle input:checked + .toggle-sl { background: var(--gold-lt); border-color: var(--gold); }
.toggle input:checked + .toggle-sl::before { transform: translateX(16px); background: var(--gold); }

/* Variants table */
.vtable { width: 100%; border-collapse: collapse; font-size: 12px; }
.vtable th {
  text-align: left; color: var(--muted);
  font-weight: 500; padding: 0 4px 5px; font-size: 10px;
}
.vtable td { padding: 3px; vertical-align: middle; }
.vtable input[type="text"],
.vtable input[type="number"] { padding: 3px 6px; font-size: 11px; }
.vtable input[type="color"] { width: 26px; height: 22px; }
.btn-del-r {
  background: none; border: none; color: var(--danger);
  cursor: pointer; font-size: 13px; padding: 1px 5px;
  border-radius: 3px; transition: background 0.12s;
}
.btn-del-r:hover { background: rgba(224,108,117,0.15); }

/* Font preview */
#font-preview {
  padding: 7px 10px; background: var(--bg);
  border-radius: var(--rsm); font-size: 17px;
  color: var(--text); border: 1px solid var(--border-lt);
  min-height: 34px;
}

/* Buttons */
.btn-primary {
  padding: 7px 14px;
  background: var(--gold); color: #1a1a2e;
  border: none; border-radius: var(--rsm);
  font-family: 'Jost', sans-serif;
  font-size: 12px; font-weight: 600;
  cursor: pointer; transition: opacity 0.12s;
}
.btn-primary:hover { opacity: 0.85; }
.btn-secondary {
  padding: 6px 12px;
  background: transparent; color: var(--muted);
  border: 1px solid var(--border-lt);
  border-radius: var(--rsm);
  font-family: 'Jost', sans-serif;
  font-size: 12px; cursor: pointer;
  transition: all 0.12s;
}
.btn-secondary:hover { color: var(--text); border-color: var(--border); }
.btn-danger {
  padding: 6px 12px; background: transparent;
  color: var(--danger);
  border: 1px solid rgba(224,108,117,0.3);
  border-radius: var(--rsm);
  font-family: 'Jost', sans-serif;
  font-size: 12px; cursor: pointer;
  transition: all 0.12s;
}
.btn-danger:hover { background: rgba(224,108,117,0.1); }
.btn-sm {
  padding: 4px 9px; font-size: 11px;
}

/* Upload area */
.upload-area {
  border: 1.5px dashed var(--border);
  border-radius: var(--rsm); padding: 12px;
  text-align: center; cursor: pointer;
  transition: border-color 0.12s;
  font-size: 12px; color: var(--muted);
}
.upload-area:hover { border-color: var(--gold); color: var(--text); }

/* Save button */
#btn-save { min-width: 90px; }
#btn-save.saved { background: #4caf50; color: #fff; }

/* ── Modal ── */
#modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.72); z-index: 500;
  align-items: center; justify-content: center;
}
#modal-overlay.open { display: flex; }
#modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px; padding: 26px;
  width: 400px; display: flex;
  flex-direction: column; gap: 14px;
}
#modal h2 { font-size: 17px; font-weight: 600; color: var(--gold); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; padding-top: 4px; }

/* Empty state */
.empty-state {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 120px; color: var(--muted);
  font-size: 12px; gap: 8px; text-align: center;
  padding: 20px;
}
.empty-state svg { opacity: 0.25; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold); }
</style>
</head>
<body>

<header id="header">
  <span id="header-title">kuztom — Admin Designs</span>
  <select id="container-type">
    <option value="gobelet">Gobelet standard</option>
  </select>
  <button class="btn-secondary" id="btn-import">↑ Importer JSON</button>
  <input type="file" id="import-file" accept=".json" style="display:none">
  <button class="btn-secondary" id="btn-export">↓ Exporter JSON</button>
  <button class="btn-primary" id="btn-save">Sauvegarder</button>
</header>

<div id="layout">

  <!-- Left: design list -->
  <div id="col-left">
    <div id="col-left-header">
      <button id="btn-new">+ Nouveau design</button>
      <div id="search-wrap">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search-input" placeholder="Rechercher…">
      </div>
    </div>
    <div id="design-list"></div>
  </div>

  <!-- Center: editor + 3D -->
  <div id="col-center">
    <div id="canvas-toolbar">
      <button class="tool-btn active" data-tool="select">↖ Sélectionner</button>
      <button class="tool-btn" data-tool="add-text">+ Zone texte</button>
      <button class="tool-btn" data-tool="add-photo">+ Zone photo</button>
    </div>
    <div id="canvas-area">
      <div id="canvas-wrap">
        <canvas id="editor-canvas"></canvas>
      </div>
      <div id="preview-section">
        <h3>Aperçu 3D</h3>
        <canvas id="preview-canvas" width="400" height="300"></canvas>
      </div>
    </div>
  </div>

  <!-- Right: properties -->
  <div id="col-right">
    <div id="props-panel">
      <div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        <p>Sélectionnez ou créez un design</p>
      </div>
    </div>
  </div>

</div>

<!-- Modal: nouveau design -->
<div id="modal-overlay">
  <div id="modal">
    <h2>Nouveau design</h2>
    <div class="field">
      <label>Nom du design</label>
      <input type="text" id="modal-name" placeholder="Ex : Baptême Bohème">
    </div>
    <div class="field">
      <label>Couleur gobelet</label>
      <div class="color-row">
        <input type="color" id="modal-color" value="#f5f0eb">
        <input type="text" id="modal-color-hex" value="#f5f0eb">
      </div>
    </div>
    <div class="field">
      <label>Design WebP (optionnel)</label>
      <div class="upload-area" id="modal-upload-area">Cliquez pour choisir un fichier WebP</div>
      <input type="file" id="modal-webp-file" accept="image/webp,image/*" style="display:none">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="modal-cancel">Annuler</button>
      <button class="btn-primary" id="modal-create">Créer</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script>
// ═══════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════
const STORAGE_KEY = 'kuztom_designs';
const TEX_W = 2000, TEX_H = 1024;
const GLB_URL = 'https://clcreation542-coder.github.io/Code-3D/Goblet.glb';

const GOOGLE_FONTS = [
  'Dancing Script','Great Vibes','Parisienne','Pacifico','Satisfy','Allura',
  'Alex Brush','Pinyon Script','Sacramento','Tangerine','Rouge Script','Italianno',
  'Mr De Haviland','Ephesis','Hurricane','Lavishly Yours','Style Script',
  'Clicker Script','Cormorant Garamond','Playfair Display','EB Garamond','Lora',
  'Libre Baskerville','Cinzel','Cinzel Decorative','Montserrat','Raleway',
  'Josefin Sans','Nunito','Quicksand','Poppins','Jost'
];

// ═══════════════════════════════════════════
//  STORAGE & HELPERS
// ═══════════════════════════════════════════
function loadDesigns() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(app.designs));
}
function slugify(s) {
  return String(s).toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
    .replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function newDesign(name, color, designUrl) {
  return {
    id: (slugify(name)||uid()) + '-' + uid(),
    name: name || 'Nouveau design',
    gobelet_color: color || '#f5f0eb',
    gobelet_opacity: 1.0,
    model_url: null,
    rotation_y: 0,
    design_url: designUrl || null,
    design: { x:0, y:0, width:TEX_W, height:TEX_H },
    variant_colors: [],
    text_zones: [],
    photo_zones: []
  };
}

// ═══════════════════════════════════════════
//  APP STATE
// ═══════════════════════════════════════════
const app = {
  designs: loadDesigns(),
  currentId: null,
  selectedZone: null,   // { type:'text'|'photo', id }
  tool: 'select',
  imgCache: {},         // designId → HTMLImageElement
  searchQuery: '',
  dragState: null,
};

function currentDesign() {
  return app.designs.find(d => d.id === app.currentId) || null;
}
function getZone(design, id) {
  return design.text_zones.find(z=>z.id===id) ||
         design.photo_zones.find(z=>z.id===id) || null;
}
function allZones(design) {
  return [
    ...(design.text_zones||[]).map(z=>({...z,_type:'text'})),
    ...(design.photo_zones||[]).map(z=>({...z,_type:'photo'}))
  ];
}

// ═══════════════════════════════════════════
//  GOOGLE FONTS
// ═══════════════════════════════════════════
const loadedFonts = new Set(['Jost']);
function loadFont(family) {
  if (loadedFonts.has(family)) return Promise.resolve();
  loadedFonts.add(family);
  return new Promise(resolve => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = `https://fonts.googleapis.com/css2?family=${family.replace(/\s+/g,'+')}:wght@400;700&display=swap`;
    link.onload = link.onerror = resolve;
    document.head.appendChild(link);
  });
}
// Preload in background
GOOGLE_FONTS.forEach(f => loadFont(f));

// ═══════════════════════════════════════════
//  CANVAS EDITOR
// ═══════════════════════════════════════════
const editorCanvas = document.getElementById('editor-canvas');
const ctx = editorCanvas.getContext('2d');
editorCanvas.width = TEX_W;
editorCanvas.height = TEX_H;

function getScale() {
  return editorCanvas.getBoundingClientRect().width / TEX_W;
}
function screenToTex(cx, cy) {
  const r = editorCanvas.getBoundingClientRect();
  const s = TEX_W / r.width;
  return { x: (cx - r.left) * s, y: (cy - r.top) * s };
}
function sizeCanvas() {
  const area = document.getElementById('canvas-area');
  const aw = area.clientWidth - 32;
  const ah = area.clientHeight * 0.62;
  let w = Math.min(aw, TEX_W);
  let h = w * TEX_H / TEX_W;
  if (h > ah) { h = ah; w = h * TEX_W / TEX_H; }
  editorCanvas.style.width  = Math.round(w) + 'px';
  editorCanvas.style.height = Math.round(h) + 'px';
  document.getElementById('canvas-wrap').style.width = Math.round(w) + 'px';
}

function drawEditor() {
  ctx.clearRect(0,0,TEX_W,TEX_H);
  const d = currentDesign();
  if (!d) {
    ctx.fillStyle = '#252545';
    ctx.fillRect(0,0,TEX_W,TEX_H);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.font = '52px Jost';
    ctx.textAlign = 'center';
    ctx.fillText('Sélectionnez ou créez un design', TEX_W/2, TEX_H/2);
    return;
  }

  // Background — blanc opaque (la transparence givrée vient du matériau Three.js)
  ctx.globalAlpha = 1;
  ctx.fillStyle   = d.gobelet_color || '#f5f0eb';
  ctx.fillRect(0,0,TEX_W,TEX_H);

  // Design image
  const img = app.imgCache[d.id];
  if (img) {
    const di = d.design || {x:0,y:0,width:TEX_W,height:TEX_H};
    ctx.drawImage(img, di.x, di.y, di.width, di.height);
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(0,0,TEX_W,TEX_H);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.font = '44px Jost'; ctx.textAlign = 'center';
    ctx.fillText('Uploadez votre WebP', TEX_W/2, TEX_H/2);
  }

  // Zones
  (d.text_zones||[]).forEach(z  => drawZone(z, 'text'));
  (d.photo_zones||[]).forEach(z => drawZone(z, 'photo'));
}

function drawZone(zone, type) {
  const sel = app.selectedZone && app.selectedZone.id === zone.id;
  ctx.fillStyle = type === 'text'
    ? 'rgba(100,150,255,0.35)'
    : 'rgba(100,220,150,0.35)';
  ctx.fillRect(zone.x, zone.y, zone.width, zone.height);

  ctx.strokeStyle = sel ? '#ffffff' : (type === 'text' ? 'rgba(100,150,255,0.85)' : 'rgba(100,220,150,0.85)');
  ctx.lineWidth = sel ? 3 : 2;
  ctx.strokeRect(zone.x, zone.y, zone.width, zone.height);

  // Tag label
  ctx.fillStyle = type === 'text' ? 'rgba(130,170,255,0.9)' : 'rgba(100,220,150,0.9)';
  ctx.font = '22px Jost';
  ctx.textAlign = 'left';
  const tag = (type === 'photo' ? '📷 ' : '') + (zone.label || zone.id);
  ctx.fillText(tag, zone.x + 7, zone.y + 28);

  // Text preview for text zones
  if (type === 'text' && zone.placeholder) {
    ctx.fillStyle = zone.color || '#7a5c2e';
    const fs = zone.font_size || 48;
    ctx.font = `${fs}px '${zone.font_family || 'Jost'}'`;
    ctx.textAlign = zone.align || 'center';
    const tx = zone.align === 'left' ? zone.x + 8
             : zone.align === 'right' ? zone.x + zone.width - 8
             : zone.x + zone.width / 2;
    const lines = zone.placeholder.split('\n');
    const lineH = fs * 1.25;
    const totalH = lines.length * lineH;
    const startY = zone.y + (zone.height - totalH) / 2 + fs * 0.85;
    lines.forEach((line, i) => ctx.fillText(line, tx, startY + i * lineH));
  }

  if (sel) drawHandles(zone);
}

function handleSize() { return Math.max(14, 10 / getScale()); }

function handlePositions(zone) {
  const { x, y, width: w, height: h } = zone;
  return [
    { x, y, h:'nw' },
    { x: x+w/2, y, h:'n' },
    { x: x+w, y, h:'ne' },
    { x: x+w, y: y+h/2, h:'e' },
    { x: x+w, y: y+h, h:'se' },
    { x: x+w/2, y: y+h, h:'s' },
    { x, y: y+h, h:'sw' },
    { x, y: y+h/2, h:'w' },
  ];
}

function drawHandles(zone) {
  const hw = handleSize() / 2;
  handlePositions(zone).forEach(({ x, y }) => {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = 'rgba(100,150,255,0.9)';
    ctx.lineWidth = 2;
    ctx.fillRect(x-hw, y-hw, hw*2, hw*2);
    ctx.strokeRect(x-hw, y-hw, hw*2, hw*2);
  });
}

function hitHandle(zone, tx, ty) {
  const hw = handleSize();
  for (const p of handlePositions(zone)) {
    if (Math.abs(tx-p.x) <= hw && Math.abs(ty-p.y) <= hw) return p.h;
  }
  return null;
}

function hitZone(zone, tx, ty) {
  return tx >= zone.x && tx <= zone.x+zone.width &&
         ty >= zone.y && ty <= zone.y+zone.height;
}

// Mouse interaction
let isDown = false, creationRect = null;

editorCanvas.addEventListener('mousedown', e => {
  const d = currentDesign(); if (!d) return;
  isDown = true;
  const { x: tx, y: ty } = screenToTex(e.clientX, e.clientY);

  if (app.tool === 'select') {
    if (app.selectedZone) {
      const zone = getZone(d, app.selectedZone.id);
      if (zone) {
        const h = hitHandle(zone, tx, ty);
        if (h) {
          app.dragState = { type:'resize', h, sx:tx, sy:ty, orig:{...zone} };
          return;
        }
      }
    }
    let hit = null;
    const zones = allZones(d);
    for (let i = zones.length-1; i >= 0; i--) {
      if (hitZone(zones[i], tx, ty)) { hit = zones[i]; break; }
    }
    if (hit) {
      app.selectedZone = { type: hit._type, id: hit.id };
      const zone = getZone(d, hit.id);
      app.dragState = { type:'move', sx:tx, sy:ty, orig:{...zone} };
    } else {
      app.selectedZone = null;
    }
    renderProps(); drawEditor();
  } else {
    creationRect = { x:tx, y:ty, width:0, height:0 };
  }
});

editorCanvas.addEventListener('mousemove', e => {
  const d = currentDesign(); if (!d) return;
  const { x: tx, y: ty } = screenToTex(e.clientX, e.clientY);

  if (!isDown) {
    if (app.tool === 'select') {
      let cursor = 'default';
      if (app.selectedZone) {
        const zone = getZone(d, app.selectedZone.id);
        if (zone) {
          const h = hitHandle(zone, tx, ty);
          if (h) {
            cursor = { nw:'nw-resize',n:'n-resize',ne:'ne-resize',e:'e-resize',
                       se:'se-resize',s:'s-resize',sw:'sw-resize',w:'w-resize' }[h] || 'pointer';
          } else if (hitZone(zone, tx, ty)) cursor = 'move';
        }
      }
      if (cursor === 'default' && allZones(d).some(z => hitZone(z, tx, ty))) cursor = 'pointer';
      editorCanvas.style.cursor = cursor;
    } else {
      editorCanvas.style.cursor = 'crosshair';
    }
    return;
  }

  if (app.tool === 'select' && app.dragState) {
    const ds = app.dragState;
    const dx = tx - ds.sx, dy = ty - ds.sy;
    const zone = getZone(d, app.selectedZone.id);
    if (!zone) return;

    if (ds.type === 'move') {
      zone.x = Math.round(ds.orig.x + dx);
      zone.y = Math.round(ds.orig.y + dy);
    } else {
      applyResize(zone, ds.orig, ds.h, dx, dy);
    }
    drawEditor();
    syncCoordInputs(zone);
  } else if (creationRect) {
    creationRect.width  = tx - creationRect.x;
    creationRect.height = ty - creationRect.y;
    drawEditor();
    ctx.strokeStyle = app.tool === 'add-text' ? 'rgba(100,150,255,0.9)' : 'rgba(100,220,150,0.9)';
    ctx.lineWidth = 3; ctx.setLineDash([10,5]);
    ctx.strokeRect(creationRect.x, creationRect.y, creationRect.width, creationRect.height);
    ctx.setLineDash([]);
  }
});

editorCanvas.addEventListener('mouseup', e => {
  const d = currentDesign();
  isDown = false;

  if (d && app.tool !== 'select' && creationRect) {
    const w = Math.abs(creationRect.width);
    const h = Math.abs(creationRect.height);
    const x = Math.round(Math.min(creationRect.x, creationRect.x + creationRect.width));
    const y = Math.round(Math.min(creationRect.y, creationRect.y + creationRect.height));
    creationRect = null;
    if (w > 20 && h > 20) {
      const id = (app.tool === 'add-text' ? 'texte' : 'photo') + '_' + uid();
      if (app.tool === 'add-text') {
        d.text_zones.push({
          id, label:'Texte', placeholder:'Texte ici', order: d.text_zones.length + 1,
          x, y, width:Math.round(w), height:Math.round(h),
          font_size:48, font_family:'Dancing Script',
          color:'#7a5c2e', align:'center', multiline:false
        });
      } else {
        d.photo_zones.push({
          id, label:'Photo', order: d.photo_zones.length + 1,
          x, y, width:Math.round(w), height:Math.round(h), shape:'rectangle'
        });
      }
      app.selectedZone = { type: app.tool === 'add-text' ? 'text' : 'photo', id };
      setTool('select');
      renderProps();
    }
  } else {
    creationRect = null;
  }

  if (app.dragState) { persist(); update3D(); }
  app.dragState = null;
  drawEditor(); persist();
});

editorCanvas.addEventListener('mouseleave', () => {
  if (isDown && app.dragState) persist();
  isDown = false; app.dragState = null; creationRect = null;
  drawEditor();
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Delete' && e.key !== 'Backspace') return;
  const el = document.activeElement;
  if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return;
  if (app.selectedZone) deleteSelectedZone();
});

function applyResize(zone, orig, h, dx, dy) {
  let { x, y, width: w, height: hh } = orig;
  if (h.includes('e')) w  = Math.max(20, w + dx);
  if (h.includes('s')) hh = Math.max(20, hh + dy);
  if (h.includes('w')) { x = x + dx; w  = Math.max(20, w - dx); }
  if (h.includes('n')) { y = y + dy; hh = Math.max(20, hh - dy); }
  zone.x = Math.round(x); zone.y = Math.round(y);
  zone.width = Math.round(w); zone.height = Math.round(hh);
}

function setTool(t) {
  app.tool = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
}

function syncCoordInputs(zone) {
  ['x','y','width','height'].forEach(k => {
    const el = document.querySelector(`.p-coord[data-k="${k}"]`);
    if (el) el.value = zone[k];
  });
}

  `).join('');

  list.querySelectorAll('.design-item').forEach(el =>
    el.addEventListener('click', e => {
      if (e.target.classList.contains('btn-dup')) return;
      selectDesign(el.dataset.id);
    })
  );
  list.querySelectorAll('.btn-dup').forEach(btn =>
    btn.addEventListener('click', e => { e.stopPropagation(); duplicateDesign(btn.dataset.id); })
  );

  // Draw thumbnails
  items.forEach(d => {
    const th = document.getElementById(`th-${d.id}`); if (!th) return;
    const tc = th.getContext('2d');
    tc.fillStyle = d.gobelet_color || '#f5f0eb';
    tc.fillRect(0,0,100,50);
    const img = app.imgCache[d.id];
    if (img) tc.drawImage(img,0,0,100,50);
  });
}

function selectDesign(id) {
  app.currentId = id;
  app.selectedZone = null;
  const d = currentDesign();
  if (d && d.design_url && !app.imgCache[id]) {
    loadImg(d).then(() => { drawEditor(); update3D(); renderDesignList(); });
  } else {
    drawEditor(); update3D();
  }
  renderDesignList(); renderProps();
}

function loadImg(d) {
  if (!d.design_url || app.imgCache[d.id]) return Promise.resolve();
  return new Promise(resolve => {
    const img = new Image();
    img.onload  = () => { app.imgCache[d.id] = img; resolve(); };
    img.onerror = resolve;
    img.src = d.design_url;
  });
}

function duplicateDesign(id) {
  const src = app.designs.find(d=>d.id===id); if (!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.name = 'Copie de ' + copy.name;
  copy.id   = slugify(copy.name) + '-' + uid();
  if (app.imgCache[id]) app.imgCache[copy.id] = app.imgCache[id];
  app.designs.push(copy);
  persist(); selectDesign(copy.id);
}

function onDesignChange() {
  drawEditor(); update3D(); renderDesignList(); persist();
}

// ═══════════════════════════════════════════
//  IMPORT / EXPORT
// ═══════════════════════════════════════════
function exportDesign() {
  const d = currentDesign();
  if (!d) return alert('Aucun design sélectionné');
  const out = {
    id: d.id, name: d.name,
    gobelet_color: d.gobelet_color,
    gobelet_opacity: d.gobelet_opacity ?? 1,
    model_url: d.model_url || null,
    rotation_y: d.rotation_y || 0,
    design_url: d.design_url || null,
    design: d.design,
    variant_colors: d.variant_colors || [],
    text_zones: d.text_zones || [],
    photo_zones: d.photo_zones || []
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (d.id || 'design') + '.json';
  a.click();
}

function importDesign(file) {
  const r = new FileReader();
  r.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.id || !data.name) return alert('JSON invalide');
      const i = app.designs.findIndex(d=>d.id===data.id);
      if (i >= 0) {
        if (!confirm(`"${data.name}" existe déjà. Remplacer ?`)) return;
        app.designs[i] = data;
      } else {
        app.designs.push(data);
      }
      persist();
      if (data.design_url) {
        loadImg(data).then(() => { selectDesign(data.id); renderDesignList(); });
      } else {
        selectDesign(data.id); renderDesignList();
      }
    } catch { alert('Erreur de lecture JSON'); }
  };
  r.readAsText(file);
}

// ═══════════════════════════════════════════
//  THREE.JS 3D PREVIEW
// ═══════════════════════════════════════════
const pCvs = document.getElementById('preview-canvas');
let scene3, cam3, ren3, grp3, ptex, ptexCtx;
let bodyMats3 = [];

function init3D() {
  scene3 = new THREE.Scene();
  scene3.background = new THREE.Color(0x16213e);
  cam3 = new THREE.PerspectiveCamera(45, 400/300, 0.1, 100);
  cam3.position.set(0, 0, 5.5);
  ren3 = new THREE.WebGLRenderer({ canvas: pCvs, antialias: true });
  ren3.setSize(400, 300);
  ren3.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  scene3.add(new THREE.AmbientLight(0xffffff, 0.75));
  const dl = new THREE.DirectionalLight(0xfff5e0, 1.2);
  dl.position.set(3, 5, 5); scene3.add(dl);

  grp3 = new THREE.Group();
  grp3.rotation.x = 0.15;
  scene3.add(grp3);

  const tc = document.createElement('canvas');
  tc.width = TEX_W; tc.height = TEX_H;
  ptexCtx = tc.getContext('2d');
  ptex = new THREE.CanvasTexture(tc);
  ptex.flipY = false;

  loadGLB3();

  // Drag to rotate
  let drag = false, lastX3 = 0, rotY3 = Math.PI;
  pCvs.addEventListener('mousedown', e => { drag = true; lastX3 = e.clientX; });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    rotY3 += (e.clientX - lastX3) * 0.012; lastX3 = e.clientX;
    if (grp3) grp3.rotation.y = rotY3;
  });
  window.addEventListener('mouseup', () => drag = false);

  (function loop() { requestAnimationFrame(loop); ren3.render(scene3, cam3); })();
}

function loadGLB3() {
  if (typeof THREE.GLTFLoader === 'undefined') { fallback3D(); return; }
  const loader = new THREE.GLTFLoader();
  if (typeof THREE.DRACOLoader !== 'undefined') {
    const draco = new THREE.DRACOLoader();
    draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
    loader.setDRACOLoader(draco);
  }
  loader.load(GLB_URL, gltf => {
    bodyMats3 = [];
    gltf.scene.traverse(child => {
      if (!child.isMesh) return;
      const mat = new THREE.MeshStandardMaterial({ map: ptex, color: 0xffffff, roughness: 0.3, metalness: 0.04, transparent: true, opacity: 0.88, side: THREE.FrontSide });
      child.material = mat; bodyMats3.push(mat);
    });
    const box  = new THREE.Box3().setFromObject(gltf.scene);
    const size = box.getSize(new THREE.Vector3());
    const ctr  = box.getCenter(new THREE.Vector3());
    const sc   = 3.6 / Math.max(size.x, size.y, size.z);
    gltf.scene.scale.setScalar(sc);
    gltf.scene.position.set(-ctr.x*sc, -ctr.y*sc, -ctr.z*sc);
    grp3.add(gltf.scene);
    const d = currentDesign();
    rotY3 = Math.PI + (d ? (d.rotation_y||0) : 0);
    grp3.rotation.y = rotY3;
    update3D();
  }, null, fallback3D);
}

function fallback3D() {
  const mat = new THREE.MeshStandardMaterial({ map: ptex, color: 0xffffff, roughness: 0.3, metalness: 0.04, transparent: true, opacity: 0.88, side: THREE.FrontSide });
  grp3.add(new THREE.Mesh(new THREE.CylinderGeometry(1, 0.82, 2.8, 64, 1, true), mat));
  bodyMats3 = [mat]; update3D();
}

function update3D() {
  if (!ptex) return;
  const d = currentDesign();
  ptexCtx.clearRect(0,0,TEX_W,TEX_H);
  if (d) {
    // Fond blanc opaque — la transparence givrée vient du matériau Three.js
    ptexCtx.globalAlpha = 1;
    ptexCtx.fillStyle   = '#ffffff';
    ptexCtx.fillRect(0,0,TEX_W,TEX_H);
    const configOpac = d.gobelet_opacity ?? 1;
    bodyMats3.forEach(m => {
      m.color.set(d.gobelet_color || '#f5f0eb');
      m.roughness   = 0.3;
      m.transparent = true;
      m.opacity     = configOpac < 1 ? configOpac : 0.88;
    });
    grp3.rotation.y = Math.PI + (d.rotation_y || 0);
    const img = app.imgCache[d.id];
    if (img) {
      const di = d.design||{x:0,y:0,width:TEX_W,height:TEX_H};
      ptexCtx.drawImage(img, di.x, di.y, di.width, di.height);
    }
    (d.text_zones||[]).forEach(z => {
      const fs = z.font_size || 48;
      ptexCtx.fillStyle = z.color||'#7a5c2e';
      ptexCtx.font      = `${fs}px '${z.font_family||'Jost'}'`;
      ptexCtx.textAlign = z.align||'center';
      const tx = z.align==='left' ? z.x+8 : z.align==='right' ? z.x+z.width-8 : z.x+z.width/2;
      const lines  = (z.placeholder||z.label||'').split('\n');
      const lineH  = fs * 1.3;
      const startY = z.y + z.height/2 - (lines.length * lineH)/2 + fs * 0.85;
      lines.forEach((line, i) => ptexCtx.fillText(line, tx, startY + i * lineH));
    });
  } else {
    ptexCtx.fillStyle = '#2a2a4a'; ptexCtx.fillRect(0,0,TEX_W,TEX_H);
  }
  ptex.needsUpdate = true;
}

// ═══════════════════════════════════════════
//  MODAL
// ═══════════════════════════════════════════
let modalWebp = null;

document.getElementById('btn-new').addEventListener('click', () => {
  modalWebp = null;
  document.getElementById('modal-name').value = '';
  document.getElementById('modal-color').value = '#f5f0eb';
  document.getElementById('modal-color-hex').value = '#f5f0eb';
  document.getElementById('modal-upload-area').textContent = 'Cliquez pour choisir un fichier WebP';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('modal-name').focus(), 50);
});

document.getElementById('modal-cancel').addEventListener('click', () =>
  document.getElementById('modal-overlay').classList.remove('open')
);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
});
document.getElementById('modal-color').addEventListener('input', e =>
  document.getElementById('modal-color-hex').value = e.target.value
);
document.getElementById('modal-color-hex').addEventListener('input', e => {
  if (/^#[0-9a-f]{6}$/i.test(e.target.value))
    document.getElementById('modal-color').value = e.target.value;
});
document.getElementById('modal-upload-area').addEventListener('click', () =>
  document.getElementById('modal-webp-file').click()
);
document.getElementById('modal-webp-file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    modalWebp = ev.target.result;
    document.getElementById('modal-upload-area').innerHTML = `<span style="color:var(--gold)">✓ ${esc(f.name)}</span>`;
  };
  r.readAsDataURL(f);
});

document.getElementById('modal-create').addEventListener('click', () => {
  const name = document.getElementById('modal-name').value.trim();
  if (!name) { document.getElementById('modal-name').focus(); return; }
  const color = document.getElementById('modal-color').value;
  const d = newDesign(name, color, modalWebp);
  app.designs.push(d);
  if (modalWebp) {
    loadImg(d).then(() => { persist(); selectDesign(d.id); renderDesignList(); });
  } else {
    persist(); selectDesign(d.id); renderDesignList();
  }
  document.getElementById('modal-overlay').classList.remove('open');
});

document.getElementById('modal-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('modal-create').click();
});

// ═══════════════════════════════════════════
//  HEADER ACTIONS
// ═══════════════════════════════════════════
document.getElementById('btn-save').addEventListener('click', () => {
  persist();
  const btn = document.getElementById('btn-save');
  btn.textContent = '✓ Sauvegardé'; btn.classList.add('saved');
  setTimeout(() => { btn.textContent = 'Sauvegarder'; btn.classList.remove('saved'); }, 1800);
});
document.getElementById('btn-export').addEventListener('click', exportDesign);
document.getElementById('btn-import').addEventListener('click', () =>
  document.getElementById('import-file').click()
);
document.getElementById('import-file').addEventListener('change', e => {
  if (e.target.files[0]) importDesign(e.target.files[0]);
  e.target.value = '';
});

// Tool buttons
document.querySelectorAll('.tool-btn').forEach(btn =>
  btn.addEventListener('click', () => setTool(btn.dataset.tool))
);

// Search
document.getElementById('search-input').addEventListener('input', e => {
  app.searchQuery = e.target.value;
  renderDesignList();
});

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
window.addEventListener('resize', () => { sizeCanvas(); drawEditor(); });

sizeCanvas();
renderDesignList();
renderProps();
drawEditor();
init3D();

// Preload images for saved designs
app.designs.forEach(d => { if (d.design_url) loadImg(d); });
</script>
